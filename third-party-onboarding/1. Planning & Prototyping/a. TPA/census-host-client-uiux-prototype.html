    }
    return '<input type="text" id="draft-edit-input" class="field-edit-input" value="'+esc(st.value)+'" placeholder="Enter a value" aria-label="'+esc(f.label)+'">';
  }

  function fieldCardHtml(f, extraClass){
    ensureDraftState();
    var st = state.draftFields[f.key];

    if(f.type === "party-table"){
      var blocked = f.ubo ? uboBlockingParties().length > 0 : false;
      var tags = st.confirmed ? '<span class="badge confirmed">'+icon("check")+' Confirmed</span>' : '<span class="badge neutral">'+(f.ubo?"Split — facts vs. conclusion":"View onto party store")+'</span>';
      if(blocked){ tags += ' <span class="badge confidence-low">Blocks HIGH-tier commit</span>'; }
      return '<div class="field-card '+(extraClass||"")+(st.confirmed?" is-confirmed":"")+'">'+
        '<div class="field-label">'+f.n+'. '+esc(f.label)+'</div>'+
        '<div class="field-tags">'+tags+'</div>'+
        partyTableRowsHtml(f)+
        '<div class="field-foot">'+citeBtn(f)+
          (st.confirmed ? '' : '<div class="inline-actions"><button type="button" class="btn" data-action="field-confirm" data-field="'+esc(f.key)+'">'+icon("check")+' Confirm</button></div>')+
        '</div>'+
      '</div>';
    }

    if(f.type === "derived-date"){
      var score = computeRiskScore();
      var derived = computeExpiry(score.tier);
      var tags = st.expiryOverride ? '<span class="badge edited">Overridden</span>' : '<span class="badge neutral">Derived</span>';
      if(score.provisional){ tags += ' <span class="badge confidence-medium">Provisional</span>'; }
      var editingExpiry = state.editingField === f.key;
      var body;
      if(editingExpiry){
        body = '<div class="field-value">'+
          '<input type="date" id="expiry-override-input" class="field-edit-input" value="'+esc(st.expiryOverride||derived)+'">'+
          '<input type="text" id="expiry-override-reason" class="field-edit-input" style="margin-top:6px;" placeholder="Reason for the override (required, logged distinctly)" value="'+esc(st.expiryOverrideReason||"")+'">'+
        '</div>'+
        '<div class="field-foot">'+citeBtn(f)+
          '<div class="inline-actions">'+
            '<button type="button" class="btn primary" data-action="expiry-save">'+icon("check")+' Save override</button>'+
            '<button type="button" class="btn subtle" data-action="field-cancel">Cancel</button>'+
          '</div>'+
        '</div>';
      } else {
        body = '<div class="field-value">'+esc(displayFieldValue(f, st))+
          (TIER_CADENCE_YEARS[score.tier]!=null ? ' <span class="mono" style="color:var(--color-muted);font-size:11.5px;">('+esc(score.tier.toUpperCase())+' cadence: '+TIER_CADENCE_YEARS[score.tier]+' year(s) from commit)</span>' : '')+
        '</div>'+
        '<div class="field-foot">'+citeBtn(f)+
          '<div class="inline-actions">'+
            '<button type="button" class="btn subtle" data-action="field-edit" data-field="'+esc(f.key)+'">'+icon("edit")+' Override</button>'+
          '</div>'+
        '</div>';
      }
      return '<div class="field-card '+(extraClass||"")+'">'+
        '<div class="field-label">'+f.n+'. '+esc(f.label)+'</div>'+
        '<div class="field-tags">'+tags+'</div>'+
        body+
      '</div>';
    }

    // Inline edit mode — the human enters/corrects the value and commits it
    if(state.editingField === f.key){
      return '<div class="field-card editing '+(extraClass||"")+'">'+
        '<div class="field-label">'+f.n+'. '+esc(f.label)+(f.scoring?' <span class="badge mandatory" style="margin-inline-start:6px;">Scoring input</span>':'')+(f.identity?' <span class="badge neutral" style="margin-inline-start:6px;">Screened identity</span>':'')+'</div>'+
        '<div class="field-tags"></div>'+
        '<div class="field-value">'+fieldEditBodyHtml(f, st)+'</div>'+
        '<div class="field-foot">'+citeBtn(f)+
          '<div class="inline-actions">'+
            '<button type="button" class="btn primary" data-action="field-save" data-field="'+esc(f.key)+'">'+icon("check")+' Save</button>'+
            '<button type="button" class="btn subtle" data-action="field-cancel">Cancel</button>'+
          '</div>'+
        '</div>'+
      '</div>';
    }

    var tags = "";
    if(f.scoring){ tags += '<span class="badge mandatory">Scoring input</span>'; }
    if(f.identity){ tags += '<span class="badge neutral">Screened identity</span>'; }
    if(st.confirmed){ tags += '<span class="badge confirmed">'+icon("check")+' Confirmed</span>'; }
    if(st.edited){ tags += '<span class="badge edited">Edited</span>'; }
    var isBlank = fieldNeedsAttention(f) && !st.confirmed;
    if(f.cls === "judgment" && !st.multiConfirmedNone && (!st.multiValues || !st.multiValues.length)){
      tags += '<span class="badge confidence-low">Needs confirmation</span>';
    } else if(!displayFieldValue(f, st) && f.type !== "derived-date"){
      tags += '<span class="badge confidence-low">Blank</span>';
    } else if(!st.edited){
      tags += confidenceBadge(f.confidence);
    }
    tags += sourceMatchBadge(st.sourceMatch);

    var valueHtml;
    var dv = displayFieldValue(f, st);
    if(!dv && f.type !== "derived-date"){
      valueHtml = f.unverified
        ? '<div class="field-value blank-note" style="color:var(--color-warning-fg);">'+icon("warn")+' Left blank — the source doesn\'t state this. Confirm directly; not guessed.</div>'
        : '<div class="field-value blank-note">'+icon("warn")+' Not found in the documents — enter manually. Nothing was guessed.</div>';
    } else {
      valueHtml = '<div class="field-value">'+esc(dv)+'</div>';
    }

    var canConfirm = f.type === "multiselect" ? (st.multiConfirmedNone || (st.multiValues && st.multiValues.length)) :
      f.type === "select-interaction" ? (st.valueGov || st.valueNonGov) : !!dv;
    var actions = '<div class="inline-actions">'+
      '<button type="button" class="btn subtle" data-action="field-edit" data-field="'+esc(f.key)+'">'+icon("edit")+' Edit</button>'+
      ((canConfirm && !st.confirmed) ? '<button type="button" class="btn" data-action="field-confirm" data-field="'+esc(f.key)+'">'+icon("check")+' Confirm</button>' : '')+
    '</div>';

    return '<div class="field-card '+(extraClass||"")+(st.confirmed?" is-confirmed":"")+(isBlank?" mandatory-review":"")+'">'+
      '<div class="field-label">'+f.n+'. '+esc(f.label)+'</div>'+
      '<div class="field-tags">'+tags+'</div>'+
      valueHtml+
      '<div class="field-foot">'+citeBtn(f)+actions+'</div>'+
    '</div>';
  }

  function saveEditField(){
    var fk = state.editingField;
    if(!fk) return;
    var f = findFieldDef(fk);
    var st = state.draftFields[fk];
    var tierBefore = computeRiskScore().tier;
    var identityBefore = f.identity ? st.value : null;
    var changed = false;

    if(f.type === "select-interaction"){
      var govInp = document.getElementById("draft-edit-input-gov");
      var ngInp = document.getElementById("draft-edit-input-nongov");
      var newGov = govInp ? govInp.value : "";
      var newNg = ngInp ? ngInp.value : "";
      changed = (newGov !== st.valueGov) || (newNg !== st.valueNonGov);
      st.valueGov = newGov; st.valueNonGov = newNg;
      if(changed){ st.edited = true; st.confirmed = true; st.sourceMatch = "agrees"; }
    } else if(f.type === "multiselect"){
      var noneBox = document.getElementById("draft-multiselect-none");
      var boxes = document.querySelectorAll(".draft-multiselect-box");
      var picked = [];
      boxes.forEach(function(b){ if(b.checked){ picked.push(b.getAttribute("data-value")); } });
      var newNone = noneBox ? noneBox.checked : false;
      changed = true;
      st.multiConfirmedNone = newNone;
      st.multiValues = newNone ? [] : picked;
      if(newNone || picked.length){ st.confirmed = true; st.edited = true; st.sourceMatch = "agrees"; }
    } else {
      var inp = document.getElementById("draft-edit-input");
      var newVal = inp ? inp.value.trim() : "";
      var prefill = f.value || "";
      changed = newVal !== st.value;
      st.value = newVal;
      if(newVal && newVal !== prefill){ st.edited = true; st.sourceMatch = "agrees"; }
      if(newVal){ st.confirmed = true; }
    }

    state.editingField = null;
    if(changed){ logConfirmationChange(f, st); }

    // Scoring-field edit re-tiers the record (TPA PRD §6) — recompute and, if the tier
    // rose, pull the newly in-scope parties into screening before commit can proceed.
    if(f.scoring && changed){
      handleRetier(tierBefore);
    }
    // Identity-field edit re-screens that party alone (TPA PRD §6).
    if(f.identity && changed){
      handleIdentityEdit(fk, identityBefore, st.value);
    }

    renderGateStep1();
    if(changed){
      toast(f.n+'. "'+f.label+'" updated'+(f.scoring?' — risk score recomputed.':(f.identity?' — re-screening…':'.')));
    }
  }

  function expirySave(){
    var dateInp = document.getElementById("expiry-override-input");
    var reasonInp = document.getElementById("expiry-override-reason");
    var f = findFieldDef("expiry");
    var st = state.draftFields.expiry;
    var reason = reasonInp ? reasonInp.value.trim() : "";
    if(!reason){ toast("An override reason is required — this is logged distinctly (TPA PRD §7)."); return; }
    st.expiryOverride = dateInp ? dateInp.value : null;
    st.expiryOverrideReason = reason;
    st.confirmed = true;
    state.confirmationLog.push({type:"expiry_override", field:"25. TPA Expiry Date", derived:computeExpiry(computeRiskScore().tier), overridden:st.expiryOverride, reason:reason, actor:"Da'yl Tan", time:"just now"});
    state.editingField = null;
    renderGateStep1();
    toast("Expiry override logged — derived value, override, and reason are all recorded distinctly.");
  }

  function logConfirmationChange(f, st){
    state.confirmationLog.push({
      type:"field_change", field:f.n+". "+f.label,
      prefill: f.value || f.valueGov || "(blank)",
      confirmed: displayFieldValue(f, st),
      actor:"Da'yl Tan", time:"just now"
    });
    logEvent("field_edited_after_prefill", {field:f.key});
  }

  function screeningRecBadge(rec){
    var map = {
      CLEARED:["confidence-high","Cleared"],
      RESOLVED_FALSE_POSITIVE:["confidence-high","Resolved false positive"],
      PENDING_REVIEW:["confidence-medium","Pending review"],
      TRUE_MATCH:["confidence-low","True match"]
    };
    var m = map[rec] || ["neutral", rec || "Not yet screened"];
    return '<span class="badge '+m[0]+'">'+m[1]+'</span>';
  }
  function checklistItemCardHtml(it, wave){
    wave = wave || 1;
    var tags = checklistStatusBadge(it.status) + (it.confidence ? confidenceBadge(it.confidence) : "");
    if(it.mandatory !== false){ tags += ' <span class="badge mandatory">Mandatory</span>'; }
    if(it.confirmed){ tags += ' <span class="badge confirmed">'+icon("check")+' Confirmed</span>'; }

    var valueHtml;
    if(it.justRemoved){
      valueHtml = '<div class="field-value blank-note" style="color:var(--color-warning-fg);">'+icon("warn")+' Document removed just now — this item now reads as Missing.</div>';
    } else if(it.status === "present"){
      valueHtml = '<div class="field-value">On file'+(it.confidence==="medium" ? " — verify legibility" : "")+'</div>';
    } else if(it.status === "nonctc"){
      valueHtml = '<div class="field-value blank-note" style="color:var(--color-danger-fg);">'+icon("warn")+' '+esc(it.note||"Certification issue detected")+'</div>';
    } else {
      valueHtml = '<div class="field-value blank-note">'+icon("warn")+' Not received'+(it.note?' — '+esc(it.note):'')+'</div>';
    }

    var cite = (!it.justRemoved && it.source) ? citeBtn({source:it.source, snippet:it.snippet||""}) : '<span class="mono" style="font-size:11px;color:var(--color-muted);">No source yet</span>';

    var wattr = ' data-wave="'+wave+'"';
    var docActions;
    if(it.justRemoved){
      docActions = '<button type="button" class="btn primary" data-action="kyc-item-undo-remove" data-item="'+esc(it.item)+'"'+wattr+'>'+icon("refresh")+' Undo</button>';
    } else if(it.status === "present" || it.status === "nonctc"){
      docActions =
        '<button type="button" class="btn subtle" data-action="kyc-item-replace" data-item="'+esc(it.item)+'"'+wattr+'>'+icon("doc")+' Replace document</button>'+
        '<button type="button" class="btn subtle" data-action="kyc-item-remove" data-item="'+esc(it.item)+'"'+wattr+'>Remove</button>';
    } else {
      docActions = '<button type="button" class="btn" data-action="kyc-item-upload" data-item="'+esc(it.item)+'"'+wattr+'>'+icon("doc")+' Upload document</button>';
    }
    var confirmAction = it.justRemoved ? "" :
      '<button type="button" class="btn'+(it.confirmed?" subtle":"")+'" data-action="'+(it.confirmed?"kyc-item-unconfirm":"kyc-item-confirm")+'" data-item="'+esc(it.item)+'"'+wattr+'>'+
        (it.confirmed ? "Unconfirm" : icon("check")+" Confirm") +
      '</button>';

    return '<div class="field-card '+(it.mandatory!==false?"mandatory-review":"")+(it.status==="nonctc"&&!it.justRemoved?" high-risk":"")+(it.confirmed?" is-confirmed":"")+'">'+
      '<div class="field-label">'+esc(it.item)+' '+esc(it.label)+'</div>'+
      '<div class="field-tags">'+tags+'</div>'+
      valueHtml+
      '<div class="field-foot">'+cite+'<div class="inline-actions">'+docActions+confirmAction+'</div></div>'+
    '</div>';
  }

  /* ============================================================
     RE-TIER / RE-SCREEN (TPA PRD §6) — editing a scoring field (3/18/20) re-tiers the
     record; if the tier rises, the parties the wider scope now covers are screened
     before commit. Editing a screened party's identity (name/country/DOB) re-screens
     that party alone. Both happen before commit can proceed — never silently skipped.
     ============================================================ */
  function partiesInScope(){
    var scope = screeningScopeForTier(computeRiskScore().tier);
    return (state.parties||[]).filter(function(p){ return scope.indexOf(p.scopeAt) !== -1; });
  }
  function handleRetier(tierBefore){
    var score = computeRiskScore();
    if(score.tier === tierBefore) return;
    state.confirmationLog.push({type:"tier_change", from:tierBefore, to:score.tier, actor:"Da'yl Tan", time:"just now"});
    if(screeningScopeForTier(score.tier).length > screeningScopeForTier(tierBefore).length){
      var newlyIn = (state.parties||[]).filter(function(p){
        return screeningScopeForTier(score.tier).indexOf(p.scopeAt) !== -1 && screeningScopeForTier(tierBefore).indexOf(p.scopeAt) === -1;
      });
      newlyIn.forEach(function(p){
        p.screening.rescreening = true;
        p.screening.recommendation = null;
        p.screening.confirmed = false;
      });
      if(newlyIn.length){
        toast("Tier rose to "+score.tier.toUpperCase()+" — screening "+newlyIn.length+" additional part"+(newlyIn.length>1?"ies":"y")+" the wider scope now covers.");
        setTimeout(function(){
          newlyIn.forEach(function(p){
            p.screening.rescreening = false;
            p.screening.recommendation = p.screening.recommendation || "CLEARED";
            p.screening.evidence = p.screening.evidence || "No hits across sanctions/PEP/adverse-media searches — screened under the wider, re-tiered scope.";
          });
          if(state.gateStep === 2){ renderGateStep2(); }
        }, 900);
      }
    }
  }
  var IDENTITY_FIELD_TO_PARTY = {personName:"ceo", countryOfResidence:"ceo", yearOfBirth:"ceo"};
  function handleIdentityEdit(fieldKey, before, after){
    var partyId = IDENTITY_FIELD_TO_PARTY[fieldKey];
    var party = (state.parties||[]).filter(function(p){ return p.id === partyId; })[0];
    if(!party) return;
    if(fieldKey === "personName"){ party.name = after; }
    if(fieldKey === "countryOfResidence"){ party.country = after; }
    if(fieldKey === "yearOfBirth"){ party.yob = after; }
    var priorRec = party.screening.recommendation;
    party.screening.rescreening = true;
    party.screening.confirmed = false;
    party.screening.recommendation = null;
    setTimeout(function(){
      party.screening.rescreening = false;
      party.screening.recommendation = "CLEARED";
      party.screening.evidence = "Re-screened under the corrected identity — supersedes the recommendation made under the earlier value ("+esc(before)+"). No hits.";
      if(state.gateStep === 2){ renderGateStep2(); }
      toast(party.name+" re-screened after the identity correction — updated recommendation ready.");
    }, 900);
  }
  function uboBlockingParties(){
    if(computeRiskScore().tier !== "high") return [];
    return partiesInScope().filter(function(p){ return p.uboResolved === false; });
  }

  /* ============================================================
     GATE STEP 1 — the 24 fields + derived expiry (TPA PRD §6).
     ============================================================ */
  function allMandatoryFieldsConfirmed(){
    return TPA_FIELD_DEFS.filter(function(f){ return f.mandatory; }).every(function(f){
      return f.type === "derived-date" ? true : state.draftFields[f.key].confirmed;
    });
  }
  function renderGateStep1(){
    ensureDraftState();
    var score = computeRiskScore();
    var all = TPA_FIELD_DEFS;
    var total = all.length;
    var attentionCount = all.filter(fieldNeedsAttention).length;
    var filter = state.draftFilter;
    var filters = [
      ["all","All fields ("+total+")"],
      ["mandatory","Mandatory only ("+all.filter(function(f){return f.mandatory;}).length+")"],
      ["attention","Needs attention ("+attentionCount+")"]
    ];
    function passes(f){ return filter === "attention" ? fieldNeedsAttention(f) : true; }

    var html = '<div class="info-banner" style="background:var(--color-success-bg);border-color:var(--color-success-border);color:var(--color-success-fg);">'+icon("check")+'<div><strong>Draft saved automatically.</strong> You can leave and resume from the home screen — your edits and uploaded documents stay attached, nothing is committed.</div></div>';

    var arith = (score.interactionScore!=null?score.interactionScore:"—")+" (interaction) + "+(score.servicesScore!=null?score.servicesScore:"—")+" (services) + "+(score.countryScore!=null?score.countryScore:"—")+" (country) = "+score.total;
    html += '<div class="panel status-card" style="max-width:none;">'+
      '<h2>Risk score '+(score.provisional?'<span class="badge confidence-medium">Provisional</span>':'')+'</h2>'+
      '<div class="panel-sub" style="margin-top:0;">'+esc(arith)+' &rarr; '+tierBadge(score.tier)+
        (state.tierAtExtraction && state.tierAtExtraction !== score.tier ? ' <span class="mono" style="color:var(--color-muted);">(extracted as '+esc(state.tierAtExtraction.toUpperCase())+')</span>' : '')+
      '</div>'+
      '<div class="readonly-note">'+icon("info")+' Fields 3, 18 and 20 are the score\'s only inputs (marked "Scoring input" below). Correcting any of them recomputes the score and tier live; if the tier rises, the newly in-scope parties are screened before commit.</div>'+
    '</div>';

    html += '<div class="filter-row">'+filters.map(function(f){
      var att = f[0] === "attention" && attentionCount > 0 ? " attention" : "";
      return '<button type="button" class="filter-chip'+att+'" data-action="draft-filter" data-filter="'+f[0]+'" aria-pressed="'+(filter===f[0])+'">'+esc(f[1])+'</button>';
    }).join("")+'</div>';

    html += '<div class="panel">';
    var groups = {}, order = [];
    all.forEach(function(f){
      var g = f.group;
      if(!groups[g]){ groups[g] = []; order.push(g); }
      groups[g].push(f);
    });
    order.forEach(function(g){
      var fields = groups[g].filter(passes);
      if(!fields.length) return;
      html += '<div class="field-section-title">'+esc(g)+'</div>';
      html += fields.map(function(f){ return fieldCardHtml(f, f.mandatory ? "mandatory-review" : ""); }).join("");
    });
    if(filter === "attention" && attentionCount === 0){
      html += '<div class="empty-state" style="padding:34px 20px;">'+icon("check")+'<h2>Nothing needs attention</h2><p>Every blank and needs-confirmation field has been confirmed or filled in.</p></div>';
    }
    html += '</div>';

    var readyForStep2 = allMandatoryFieldsConfirmed();
    html += '<div class="inline-actions" style="margin-bottom:8px;">'+
      '<button type="button" class="btn primary" data-action="gate-continue-step2" '+(readyForStep2?"":"disabled")+'>Continue to screening (step 2) &rarr;</button>'+
      (readyForStep2 ? '' : '<span class="mono" style="font-size:11.5px;color:var(--color-muted);">Confirm every mandatory field first.</span>')+
    '</div>';

    $("#canvas-body").innerHTML = html;
    if(state.editingField){
      var inp = document.getElementById("draft-edit-input") || document.getElementById("draft-edit-input-gov");
      if(inp){ inp.focus(); }
    }
  }

  /* ============================================================
     GATE STEP 2 — screening panel (TPA PRD §6/§7). Unlocks once step 1 is confirmed.
     Party identities stay editable in place here without reopening step 1. Both steps
     write to ONE confirmation_log entry — still a single gate.
     ============================================================ */
  function partyCardHtml(p){
    var st = p.screening;
    var editingId = "party-edit-" + p.id;
    var isEditing = state.editingField === editingId;
    var body;
    if(isEditing){
      body = '<div style="display:flex;flex-direction:column;gap:6px;margin:6px 0;">'+
        '<label style="font-size:11px;color:var(--color-muted);">Name<input type="text" id="'+editingId+'-name" class="field-edit-input" value="'+esc(p.name)+'"></label>'+
        '<label style="font-size:11px;color:var(--color-muted);">Country<select id="'+editingId+'-country" class="field-edit-input">'+
          COUNTRY_SCORES.map(function(c){ return '<option value="'+esc(c.name)+'"'+(p.country===c.name?" selected":"")+'>'+esc(c.name)+'</option>'; }).join("")+
        '</select></label>'+
        (p.yob != null ? '<label style="font-size:11px;color:var(--color-muted);">Year of birth<input type="text" id="'+editingId+'-yob" class="field-edit-input" value="'+esc(p.yob)+'"></label>' : '')+
        '<div class="inline-actions">'+
          '<button type="button" class="btn primary" data-action="party-save" data-party="'+esc(p.id)+'">'+icon("check")+' Save &amp; re-screen</button>'+
          '<button type="button" class="btn subtle" data-action="field-cancel">Cancel</button>'+
        '</div>'+
      '</div>';
    } else {
      body = st.rescreening
        ? '<div class="field-value blank-note">'+icon("spinner")+' Re-screening under the corrected identity…</div>'
        : '<div class="field-value">'+esc(st.evidence||"")+'</div>';
    }
    var overrideCtl = "";
    if(!st.rescreening && !isEditing){
      if(st.confirmed || st.override){
        overrideCtl = '<span class="badge confidence-high">'+icon("check")+' '+(st.override?"Overridden — "+esc(st.override):"Confirmed")+'</span>';
      } else {
        overrideCtl = '<div class="inline-actions">'+
          '<button type="button" class="btn" data-action="party-confirm" data-party="'+esc(p.id)+'">'+icon("check")+' Confirm recommendation</button>'+
          '<select class="field-edit-input" style="width:auto;padding:6px 8px;" data-action-select="party-override-select" data-party="'+esc(p.id)+'">'+
            '<option value="">Override to…</option>'+
            '<option value="CLEARED">CLEARED</option>'+
            '<option value="RESOLVED_FALSE_POSITIVE">RESOLVED_FALSE_POSITIVE</option>'+
            '<option value="PENDING_REVIEW">PENDING_REVIEW</option>'+
            '<option value="TRUE_MATCH">TRUE_MATCH</option>'+
          '</select>'+
        '</div>';
      }
    }
    var uboNote = "";
    if(p.uboResolved === false){
      uboNote = '<div class="readonly-note" style="background:var(--color-warning-bg);color:var(--color-warning-fg);margin-top:8px;">'+icon("warn")+
        ' Beneficial-owner conclusion unresolved at layer '+esc(p.uboUnresolvedLayer)+' — '+esc(p.uboUnresolvedReason)+
        (computeRiskScore().tier === "high"
          ? ' <strong>This blocks commit at HIGH tier.</strong> <button type="button" class="btn subtle" data-action="ubo-resolve-prompt" data-party="'+esc(p.id)+'" style="margin-inline-start:6px;">Resolve now &rarr;</button>'
          : ' Flagged only — UBOs are outside scope at this tier.')+
      '</div>';
    }
    return '<div class="field-card '+(p.uboResolved===false && computeRiskScore().tier==="high" ? "high-risk" : "")+'">'+
      '<div class="field-label">'+esc(p.name)+' <span style="font-weight:400;color:var(--color-muted);">— '+esc(p.role)+'</span>'+(p.humanSupplied?' <span class="badge neutral">Human-supplied</span>':'')+'</div>'+
      '<div class="field-tags">'+screeningRecBadge(st.override || st.recommendation)+'</div>'+
      body+
      uboNote+
      '<div class="field-foot">'+
        '<span class="mono" style="font-size:11px;color:var(--color-muted);">'+esc(p.country)+(p.yob?" · b. "+esc(p.yob):"")+'</span>'+
        '<div class="inline-actions">'+
          (!isEditing && !st.rescreening ? '<button type="button" class="btn subtle" data-action="party-edit" data-party="'+esc(p.id)+'">'+icon("edit")+' Edit identity</button>' : '')+
          overrideCtl+
        '</div>'+
      '</div>'+
    '</div>';
  }
  function allScreeningResolved(){
    return partiesInScope().every(function(p){ return !p.screening.rescreening && (p.screening.confirmed || p.screening.override); });
  }
  function renderGateStep2(){
    ensureDraftState();
    state.gateStep = 2;
    var score = computeRiskScore();
    var scope = screeningScopeForTier(score.tier);
    var inScope = partiesInScope();
    var blocking = uboBlockingParties();

    var header = document.getElementById("canvas-bottom-header");
    if(header){ header.innerHTML = '<div><h1>Step 2 — Screening</h1><div class="sub">'+esc(score.tier.toUpperCase())+' tier scope: '+esc(scope.join(" + "))+' · '+inScope.length+' parties</div></div>'; }
    var pane = document.querySelector(".canvas-bottom");
    var top = document.querySelector(".canvas-top");
    if(pane){ pane.classList.remove("hidden"); }
    if(top){ top.classList.remove("full"); }
    var splitResizer = document.getElementById("canvas-split-resizer");
    if(splitResizer){ splitResizer.style.display = ""; }

    var html = '<div class="info-banner">'+icon("info")+'<div>Screening ran automatically on the extracted party list. Each recommendation below is a suggestion — confirm it, or override it with a rationale. Party identities are editable here, in place — a correction re-screens that party before commit.</div></div>';

    if(blocking.length){
      html += '<div class="info-banner" style="background:var(--color-danger-bg);border-color:var(--color-danger-border);color:var(--color-danger-fg);">'+icon("warn")+
        '<div><strong>Commit blocked.</strong> The ownership chain behind '+blocking.map(function(p){return esc(p.name);}).join(", ")+' is unresolved, and UBOs are in scope at HIGH tier. Supply a document that resolves the chain, or state the beneficial owner yourself (logged as human-supplied, then screened) before this can commit.</div></div>';
    }

    html += '<div class="panel">';
    html += inScope.map(partyCardHtml).join("");
    html += '</div>';

    var readyToCommit = allScreeningResolved() && blocking.length === 0;
    html += '<div class="inline-actions">'+
      '<button type="button" class="btn subtle" data-action="gate-back-step1">&larr; Back to fields</button>'+
      '<button type="button" class="btn primary" data-action="gate-commit" '+(readyToCommit?"":"disabled")+'>Confirm &amp; commit</button>'+
      (readyToCommit ? '' : '<span class="mono" style="font-size:11.5px;color:var(--color-muted);">Resolve every party (and any UBO block) first.</span>')+
    '</div>';
    document.getElementById("compliance-screening-permanent").innerHTML = html;
  }
  function hideGateStep2(){
    var pane = document.querySelector(".canvas-bottom");
    var top = document.querySelector(".canvas-top");
    if(pane){ pane.classList.add("hidden"); }
    if(top){ top.classList.add("full"); }
    var splitResizer = document.getElementById("canvas-split-resizer");
    if(splitResizer){ splitResizer.style.display = "none"; }
  }

  /* ============================================================
     OPEN ITEMS (TPA PRD §9.4) — a committed record shows HAS OPEN ITEMS, naming what's
     open: a blank mandatory field, an unconfirmed judgment field, or an overridden
     screening recommendation.
     ============================================================ */
  function computeOpenItems(){
    var reasons = [];
    if(state.draftFields){
      TPA_FIELD_DEFS.forEach(function(f){
        if(!f.mandatory) return;
        var st = state.draftFields[f.key];
        if(f.cls === "judgment" && !st.multiConfirmedNone && (!st.multiValues || !st.multiValues.length)){
          reasons.push(f.n+". "+f.label+" — left needs-confirmation");
        }
      });
    }
    (state.parties||[]).forEach(function(p){
      if(p.screening && p.screening.override){ reasons.push(p.name+" — screening recommendation overridden ("+p.screening.override+")"); }
    });
    return {hasOpenItems: reasons.length > 0, reasons: reasons};
  }

  /* ============================================================
     COMMIT (TPA PRD §6/§9.2) — writes confirmed_tpa_payload + confirmation_log, then
     commits. No export is produced; the record is committed in Census.
     ============================================================ */
  function commitRecord(){
    var score = computeRiskScore();
    var expiryField = state.draftFields.expiry;
    var expiry = expiryField.expiryOverride || computeExpiry(score.tier);
    state.recordStatus = "committed";
    var openItems = computeOpenItems();
    var version = {
      versionLabel: state.committedVersions.length ? "Amendment "+state.committedVersions.length : "Original onboarding",
      tier: score.tier, score: score, expiry: expiry,
      confirmationLog: state.confirmationLog.slice(),
      time: "just now"
    };
    state.committedVersions.push(version);

    var existing = THIRD_PARTIES.filter(function(tp){ return tp.ref === COMPANY.ref; })[0];
    if(!existing){
      existing = {name:COMPANY.name, ref:COMPANY.ref, cachedAt:"Just now"};
      THIRD_PARTIES.unshift(existing);
    }
    existing.tier = score.tier;
    existing.status = "Committed";
    existing.expiry = expiry;
    existing.openItems = openItems.hasOpenItems;
    existing.openItemsWhy = openItems.reasons.join("; ");
    existing.cachedAt = "Just now";

    pushRecent({name:COMPANY.name, ref:COMPANY.ref, tier:score.tier, status:"Committed"});
    hideGateStep2();
    state.inProgressTpa = null;

    var moved = state.tierAtExtraction && state.tierAtExtraction !== score.tier;
    addMessage("bot",
      '<p><strong>'+esc(COMPANY.name)+' is committed in Census</strong> as <strong>'+esc(COMPANY.ref)+'</strong>. There is no export and no downstream handoff — the record is viewable and reviewable right here.</p>'+
      '<p>Risk score: '+score.total+' &rarr; <strong>'+score.tier.toUpperCase()+'</strong> (interaction '+score.interactionScore+' + services '+score.servicesScore+' + country '+score.countryScore+')'+(moved?' — moved from '+esc(state.tierAtExtraction.toUpperCase())+' at extraction.':'.')+'</p>'+
      '<p>Expiry: <strong>'+esc(fmtDate(expiry))+'</strong> ('+score.tier.toUpperCase()+' cadence'+(expiryField.expiryOverride?', overridden':'')+').</p>'+
      (openItems.hasOpenItems ? '<p>'+icon("warn")+' <strong>HAS OPEN ITEMS:</strong> '+esc(openItems.reasons.join("; "))+'</p>' : '<p>No open items — every mandatory field is confirmed and every screening recommendation resolved.</p>')+
      '<div class="inline-actions"><button type="button" class="btn primary" data-action="go-view" data-view="status">View status card</button></div>',
      {handoff:true}
    );
  }

  function runProcessingSequence(mode, steps){
    var i = 0;
    function stepEl(id){ return document.querySelector('.ptrack-step[data-step="'+id+'"]'); }
    function mark(id, cls, iconName){
      var e = stepEl(id);
      if(!e) return;
      e.className = "ptrack-step " + cls;
      if(iconName){ e.querySelector(".ptrack-icon").innerHTML = icon(iconName); }
    }
    function tick(){
      if(i > 0){ mark(steps[i-1].id, "done", "check"); }
      if(i < steps.length){
        mark(steps[i].id, "active", "spinner");
        var cur = i;
        setTimeout(function(){
          i = cur + 1;
          tick();
        }, 750);
      } else {
        setTimeout(function(){
          if(mode === "renew"){ renderRenewDelta(); } else { renderOnboardDraft(); }
        }, 350);
      }
    }
    tick();
  }

  // Mirrors runProcessingSequence's tick loop exactly (kept as a separate function rather
  // than a shared abstraction so Phase 1 doesn't risk the already-tested TPA sequence).
  function runKycProcessingSequence(steps){
    var i = 0;
    function stepEl(id){ return document.querySelector('.ptrack-step[data-step="'+id+'"]'); }
    function mark(id, cls, iconName){
      var e = stepEl(id);
      if(!e) return;
      e.className = "ptrack-step " + cls;
      if(iconName){ e.querySelector(".ptrack-icon").innerHTML = icon(iconName); }
    }
    function tick(){
      if(i > 0){ mark(steps[i-1].id, "done", "check"); }
      if(i < steps.length){
        mark(steps[i].id, "active", "spinner");
        var cur = i;
        setTimeout(function(){ i = cur + 1; tick(); }, 750);
      } else {
        setTimeout(function(){ renderKycWave1Draft(); }, 350);
      }
    }
    tick();
  }

  // Runtime per-item state for the Wave 1 checklist (mirrors ensureDraftState/draftFields'
  // pattern for TPA fields) — confirm/unconfirm, replace/remove the attached document.
  // Seeded from WAVE1_CHECKLIST once per case; startKycCase resets it for a fresh case.
  function ensureKycWave1State(){
    if(state.kycWave1) return;
    state.kycWave1 = {};
    WAVE1_CHECKLIST.forEach(function(it){
      state.kycWave1[it.item] = {
        item: it.item, group: it.group, label: it.label,
        status: it.status, confidence: it.confidence || null,
        source: it.source || null, snippet: it.snippet || null, note: it.note || null,
        mandatory: it.mandatory,
        confirmed: false,
        justRemoved: false,      // true right after "Remove" — shows the inline Undo
        removedSnapshot: null    // full prior record, restored verbatim on Undo
      };
    });
  }
  function resetKycWave1State(){ state.kycWave1 = null; }

  // Runtime Wave 2 checklist state — same shape/mechanics as Wave 1's (ensureKycWave1State),
  // tier-scoped: Standard gets WAVE2_STANDARD_ITEMS only, Enhanced adds the 3 Q5 items.
  // kycWave2Defs is kept alongside so render/summary code has a stable definition order to
  // iterate (state.kycWave2 itself is keyed by item id, not guaranteed-ordered by content).
  function ensureKycWave2State(tier){
    if(state.kycWave2) return;
    state.kycWave2Defs = WAVE2_STANDARD_ITEMS.concat(tier === "Enhanced" ? WAVE2_ENHANCED_ONLY_ITEMS : []);
    state.kycWave2 = {};

      state.kycWave2[it.item] = {
        item: it.item, group: it.group, label: it.label,
        status: it.status, confidence: it.confidence || null,
        source: it.source || null, snippet: it.snippet || null, note: it.note || null,
        mandatory: it.mandatory,
        confirmed: false, justRemoved: false, removedSnapshot: null
      };
    });
  }

  // Shared re-render dispatch for the per-item document actions (confirm/replace/remove/undo),

  /* ============================================================

     Content-free status only — no hit data, scores, or match detail, ever.

  function renderKycScreeningGate(){

    state.inProgressKyc = {name:KYC_CASE.name, ref:KYC_CASE.ref, mode:"kyc-screening", label:"Screening gate"};

      '<div class="readonly-note">'+icon("info")+' No hit data, match scores, or match detail is shown here, ever — this is purely an unlock gate. Resolution happens entirely outside this chat (KYC PRD §7.3, §2.1).</div>'+

  /* ============================================================
     CDD TYPING QUESTIONNAIRE (KYC PRD §7.3) — grouped per TPA PRD §5's field-volume
     guidance (About = Q1-4, Risk Factors = Q5-19 collapsed by default). One submit,
     not per-question confirm — this is a questionnaire, not a field-review ledger.
     ============================================================ */
  function ensureCddTypingState(){
    if(state.cddTyping) return;
    state.cddTyping = {};
    CDD_TYPING_QUESTIONS.forEach(function(q){
      state.cddTyping[q.q] = {value: q.value};
    });
  }
  function resetCddTypingState(){
    state.cddTyping = null;
    state.cddRiskExpanded = false;
    state.resolvedCddTier = null;
  }
  function resolveCddTier(){
    var aboutYes = CDD_TYPING_QUESTIONS.filter(function(q){ return q.group === "about"; })
      .some(function(q){ return state.cddTyping[q.q].value === "Yes"; });
    if(aboutYes) return {tier:"Simplified", trigger:null};
    var riskHit = CDD_TYPING_QUESTIONS.filter(function(q){ return q.group === "risk"; })
      .filter(function(q){ return state.cddTyping[q.q].value === "Yes"; });
    if(riskHit.length) return {tier:"Enhanced", trigger:riskHit[0]};
    return {tier:"Standard", trigger:null};
  }
  function cddQuestionRowHtml(q){
    var st = state.cddTyping[q.q];
    var suggested = !st.value && q.suggested;
    var needsInput = !st.value && !q.suggested;
    var rowClass = suggested ? "suggested" : needsInput ? "needs-input" : "";
    var displayVal = st.value; // the suggestion is never treated as an answer until picked
    var note = suggested
      ? '<div class="cdd-note">Suggested: '+esc(q.suggested.value)+' — '+esc(q.suggested.basis)+'</div>'
      : (q.note ? '<div class="cdd-note" style="color:var(--color-warning-fg);">'+esc(q.note)+'</div>' : "");
    return '<div class="cdd-row '+rowClass+'">'+
      '<span class="cdd-q">Q'+esc(q.q)+'</span>'+
      '<div class="cdd-body"><div class="cdd-label">'+esc(q.label)+'</div>'+note+'</div>'+
      '<div class="cdd-answer-toggle">'+
        '<button type="button" class="cdd-answer-btn" data-action="cdd-answer" data-q="'+esc(q.q)+'" data-value="Yes" aria-pressed="'+(displayVal==="Yes")+'">Yes</button>'+
        '<button type="button" class="cdd-answer-btn" data-action="cdd-answer" data-q="'+esc(q.q)+'" data-value="No" aria-pressed="'+(displayVal==="No")+'">No</button>'+
      '</div>'+
    '</div>';
  }
  function renderKycCddTyping(opts){
    opts = opts || {};
    ensureCddTypingState();
    setCanvasHeader("CDD Typing — " + KYC_CASE.name, "19 questions · staged, not submitted.", "welcome");
    if(!state.resolvedCddTier){
      state.inProgressKyc = {name:KYC_CASE.name, ref:KYC_CASE.ref, mode:"kyc-cdd-typing", label:"CDD Typing"};
    }

    if(state.resolvedCddTier){
      var tierNote = state.resolvedCddTier === "Simplified"
        ? "Simplified-eligible — no Wave 2 applies. This case moves straight to review."
        : "Wave 2 is next.";
      var html = '<div class="info-banner" style="background:var(--color-success-bg);border-color:var(--color-success-border);color:var(--color-success-fg);">'+icon("check")+
        '<div><strong>CDD Typing staged.</strong> Resolved tier: <strong>'+esc(state.resolvedCddTier)+'</strong>. '+esc(tierNote)+'</div></div>';
      html += '<div class="panel"><h2>Resolved tier</h2>'+tierBadge(state.resolvedCddTier === "Enhanced" ? "high" : state.resolvedCddTier === "Standard" ? "medium" : "low")+
        '<div class="panel-sub" style="margin-top:8px;">Answers are staged, not submitted — read-only below.</div></div>';
      ["about","risk"].forEach(function(g){
        html += '<div class="field-section-title">'+(g==="about" ? "About "+esc(KYC_CASE.name)+" (Q1–4)" : "Risk Factors (Q5–19)")+'</div><div class="panel">';
        html += CDD_TYPING_QUESTIONS.filter(function(q){ return q.group===g; }).map(function(q){
          var v = state.cddTyping[q.q].value;
          return '<div class="cdd-row"><span class="cdd-q">Q'+esc(q.q)+'</span><div class="cdd-body"><div class="cdd-label">'+esc(q.label)+'</div></div>'+
            '<span class="badge '+(v==="Yes"?"tier-high":"neutral")+'">'+esc(v||"—")+'</span></div>';
        }).join("");
        html += '</div>';
      });
      $("#canvas-body").innerHTML = html;
      return;
    }

    var aboutHtml = CDD_TYPING_QUESTIONS.filter(function(q){ return q.group === "about"; }).map(cddQuestionRowHtml).join("");
    var riskQs = CDD_TYPING_QUESTIONS.filter(function(q){ return q.group === "risk"; });
    var riskAnswered = riskQs.filter(function(q){ return state.cddTyping[q.q].value; }).length;
    var riskHtml = riskQs.map(cddQuestionRowHtml).join("");

    var html = '<div class="info-banner">'+icon("info")+'<div>No screening-derived recommendation flags arose for this case — Q5 and Q11 are the only questions eligible for one, and neither triggered.</div></div>';
    html += '<div class="panel">';
    html += '<div class="field-section-title" style="margin-top:0;">About '+esc(KYC_CASE.name)+' (Q1–4)</div>'+aboutHtml;
    html += '<button type="button" class="cdd-group-toggle" data-action="cdd-toggle-risk" aria-expanded="'+state.cddRiskExpanded+'">'+
      '<span class="field-section-title">Risk Factors (Q5–19) — '+riskAnswered+' of '+riskQs.length+' answered</span>'+
      '<svg class="cdd-caret" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
    '</button>';
    if(state.cddRiskExpanded){ html += riskHtml; }
    else { html += '<div class="panel-sub" style="margin:0 0 8px;">19 mostly-No questions — collapsed by default (field-volume guidance). Expand to review, or answer Q12 directly below.</div>'; }
    // Q12 has no default and no suggestion — always surfaced even while the group is
    // collapsed, so the one question that actually needs input is never hidden.
    if(!state.cddRiskExpanded){
      var q12 = CDD_TYPING_QUESTIONS.filter(function(q){ return q.q === "12"; })[0];
      html += cddQuestionRowHtml(q12);
    }
    html += '</div>';
    html += '<div class="inline-actions" style="margin-top:4px;"><button type="button" class="btn primary" data-action="cdd-submit">Submit CDD Typing</button></div>';
    $("#canvas-body").innerHTML = html;
    if(opts.silent) return;
  }

  /* ============================================================
     CASE STATUS (KYC PRD §7.10) — read-only, no screening-hit content beyond the
     content-free gate label. Stage vocabulary matches the PRD's own six states.
     ============================================================ */
  function kycCaseStage(){
    if(state.kycCaseComplete) return "Complete";
    if(state.resolvedCddTier === "Simplified") return "Review";
    if(state.resolvedCddTier) return "Wave 2 chase";
    if(state.kycScreeningGate === "CLEARED") return "CDD typing";
    if(state.kycScreeningGate === "PENDING") return "Waiting on screening resolution";
    if(state.kycWave1) return "Wave 1 chase";
    return "Not started";
  }
  // Counts mandatory items only — a non-mandatory Missing item (e.g. Wave 1's 1.3,
  // "where applicable") isn't outstanding work, so it shouldn't inflate this number.
  function kycOutstandingCount(){
    function openMandatory(store){
      if(!store) return 0;
      return Object.keys(store).filter(function(k){ return store[k].status !== "present" && store[k].mandatory !== false; }).length;
    }
    return openMandatory(state.kycWave1) + openMandatory(state.kycWave2);
  }
  function renderKycStatus(){
    setCanvasHeader("Case status", "Read-only. No screening-hit content is shown here (KYC PRD §7.10).", "welcome");
    var html = '<div class="panel status-card">'+
      '<div class="status-row"><span class="k">Case</span><span class="v">'+esc(KYC_CASE.name)+'</span></div>'+
      '<div class="status-row"><span class="k">Reference</span><span class="v mono">'+esc(KYC_CASE.ref)+'</span></div>'+
      '<div class="status-row"><span class="k">Stage</span><span class="v">'+esc(kycCaseStage())+'</span></div>'+
      '<div class="status-row"><span class="k">Resolved CDD tier</span><span class="v">'+(state.resolvedCddTier ? esc(state.resolvedCddTier) : "—")+'</span></div>'+
      '<div class="status-row"><span class="k">Outstanding items</span><span class="v">'+kycOutstandingCount()+'</span></div>'+
      '<div class="readonly-note">'+icon("info")+' Read-only summary — no hit data, match scores, or adjudication controls appear here, ever.</div>'+
    '</div>';
    $("#canvas-body").innerHTML = html;
  }
  function startKycStatus(){
    goView("welcome");
    renderKycStatus();
    pushRecent({name:KYC_CASE.name, ref:KYC_CASE.ref, tier:null, status:"Status checked"});
    addMessage("user", "Where is " + KYC_CASE.name + "'s KYC?");
    setTimeout(function(){ addMessage("bot", "Here's the latest read-only summary — see the workspace panel on the right."); }, 400);
  }

  /* ============================================================
     REVIEW PACK (KYC PRD §7.9) — mirrors TPA's Review Pack
     but grouped by wave/section with a mandatory-review-only filter, since a case can
     carry up to ~39 items across Wave 1 + CDD Typing + Wave 2 combined (the gap the
     Census Output 5 walkthrough flagged in FM&I KYC - Output Templates.md, now fixed
     there and here).
     ============================================================ */
  function kycReviewPackRows(){
    var rows = [];
    if(state.kycWave1){
      WAVE1_CHECKLIST.forEach(function(def){
        var it = state.kycWave1[def.item];
        rows.push({section:"Wave 1 — "+it.group, id:it.item, label:it.label, value:checklistStatusBadge(it.status), source:it.source, snippet:it.snippet, confidence:it.confidence, mandatory: it.mandatory !== false});
      });
    }
    if(state.cddTyping){
      CDD_TYPING_QUESTIONS.forEach(function(q){
        var v = state.cddTyping[q.q].value;
        rows.push({section:"CDD Typing — "+(q.group==="about"?"About":"Risk Factors"), id:"Q"+q.q, label:q.label, value:'<span class="badge '+(v==="Yes"?"tier-high":"neutral")+'">'+esc(v||"—")+'</span>', source:null, snippet:null, confidence:null, mandatory:true});
      });
    }
    if(state.kycWave2){
      state.kycWave2Defs.forEach(function(def){
        var it = state.kycWave2[def.item];
        rows.push({section:"Wave 2 — "+it.group, id:it.item, label:it.label, value:checklistStatusBadge(it.status), source:it.source, snippet:it.snippet, confidence:it.confidence, mandatory: it.mandatory !== false});
      });
    }
    return rows;
  }
  function renderKycReviewPack(){
    setCanvasHeader("Review pack", KYC_CASE.name + " · grouped by wave/section, mandatory-review filter available", "welcome");
    var rows = kycReviewPackRows();
    if(!rows.length){
      $("#canvas-body").innerHTML = '<div class="empty-state">'+icon("inbox")+'<h2>Nothing staged yet</h2><p>Start a KYC case (Wave 1) before a review pack has anything to show.</p></div>';
      return;
    }
    var filter = state.kycReviewFilter;
    var mandatoryCount = rows.filter(function(r){ return r.mandatory; }).length;
    var filterHtml = [["all","All items ("+rows.length+")"],["mandatory","Mandatory-review only ("+mandatoryCount+")"]].map(function(f){
      return '<button type="button" class="filter-chip" data-action="kyc-review-filter" data-filter="'+f[0]+'" aria-pressed="'+(filter===f[0])+'">'+esc(f[1])+'</button>';
    }).join("");
    var filtered = filter === "mandatory" ? rows.filter(function(r){ return r.mandatory; }) : rows;
    var groups = {}, order = [];
    filtered.forEach(function(r){ if(!groups[r.section]){ groups[r.section] = []; order.push(r.section); } groups[r.section].push(r); });
    var html = '<div class="info-banner">'+icon("info")+"<div>Evidence only — no verdict or “matches” column. The human makes the call.</div></div>";
    html += '<div class="filter-row">'+filterHtml+'</div>';
    if(!order.length){
      html += '<div class="empty-state" style="padding:34px 20px;">'+icon("check")+'<h2>Nothing in this filter</h2></div>';
    }
    order.forEach(function(g){
      var body = groups[g].map(function(r){
        return '<tr><td>'+esc(r.id)+' '+esc(r.label)+'</td><td>'+r.value+'</td>'+
          '<td>'+(r.source ? '<button type="button" class="cite-link" data-action="open-citation" data-source="'+esc(r.source)+'" data-snippet="'+esc(r.snippet||"")+'">'+icon("doc")+' '+esc(r.source)+'</button>' : '<span class="mono" style="font-size:11px;color:var(--color-muted);">—</span>')+'</td>'+
          '<td>'+(r.confidence ? confidenceBadge(r.confidence) : "—")+'</td>'+
          '<td>'+(r.mandatory ? '<span class="badge mandatory">Yes</span>' : "No")+'</td></tr>';
      }).join("");
      html += '<div class="panel"><h2 style="font-size:13px;">'+esc(g)+'</h2><table class="data-table"><thead><tr><th scope="col">Item</th><th scope="col">Value</th><th scope="col">Source reference</th><th scope="col">Confidence</th><th scope="col">Mandatory?</th></tr></thead><tbody>'+body+'</tbody></table></div>';
    });
    $("#canvas-body").innerHTML = html;
  }

  function promptStartKycCaseName(){
    goView("welcome");
    addMessage("bot", "<p>Which company or customer is this KYC case for? Type a name below, or pick from your recent cases.</p>" + buildNamePromptHtml("kyc-start"));
  }
  // §7.1-equivalent dedup check for KYC (KYC PRD §7.1) — same mechanism as TPA's startFind,
  // against the KYC case registry instead of the third-party registry.
  function startKycFind(companyName, opts){
    opts = opts || {};
    goView("kyc-find");
    var name = companyName || KYC_CASE.name;
    if(!opts.skipUserMsg){ addMessage("user", esc(companyName ? "Find " + companyName : "Find " + KYC_CASE.name)); }
    var match = findRecordFor(name);
    state.lastFindMatch = match;
    setTimeout(function(){
      if(match){
        // Prefer this session's own live status over the static cached-registry one —
        // otherwise re-finding a case you've already progressed past this session would
        // claim it's still at whatever stage the seed data says, undermining "Continue
        // this case" actually resuming correctly (resumeKycCase, below).
        var liveEntry = state.recentlyWorked.filter(function(r){ return r.ref === match.ref; })[0];
        var displayStatus = liveEntry ? liveEntry.status : match.status;
        pushRecent({name:match.name, ref:match.ref, tier:match.tier, status:displayStatus});
        addMessage("bot",
          '<p>Found it — <strong>'+esc(match.name)+'</strong>, <span class="mono">'+esc(match.ref)+'</span>, currently at <strong>'+esc(displayStatus)+'</strong>.</p>'+
          '<div class="inline-actions">'+
            '<button type="button" class="btn primary" data-action="kyc-continue-case" data-name="'+esc(match.name)+'">Continue this case</button>'+
          '</div>'
        );
      } else {
        addMessage("bot",
          '<p>No existing KYC case found for “<strong>'+esc(name)+'</strong>”.</p>'+
          '<div class="inline-actions"><button type="button" class="btn primary" data-action="kyc-start-new" data-name="'+esc(name)+'">Start new KYC case for “'+esc(name)+'”</button></div>'
        );
      }
    }, 500);
  }

  // "Continue this case" (Flow A's registry-match resume path) must pick up at whatever
  // stage the case actually reached this session, not silently restart Wave 1 — the gap
  // Census Output 5 flagged ("Resume at Wave 2" chip) and left for a later phase.
  // Checked latest-stage-first since a case that reached Wave 2 also has kycWave1 set.
  function resumeKycCase(){
    goView("welcome");
    if(state.kycCaseComplete){
      renderKycStatus();
      addMessage("bot", "This case is already complete — here's the latest status. See the workspace panel on the right.");
      return;
    }
    if(state.kycWave2){
      renderKycWave2Draft({silent:true});
      addMessage("bot", "Picking up at Wave 2 — see the workspace panel on the right.");
      return;
    }
    if(state.resolvedCddTier){
      // Enhanced/Standard resolved but Wave 2 not yet opened (e.g. mid-transition)
      renderKycWave2Draft({silent:true});
      addMessage("bot", "Picking up at Wave 2 — see the workspace panel on the right.");
      return;
    }
    if(state.cddTyping){
      renderKycCddTyping({silent:true});
      addMessage("bot", "Picking up at CDD Typing — see the workspace panel on the right.");
      return;
    }
    if(state.kycScreeningGate){
      renderKycScreeningGate();
      addMessage("bot", state.kycScreeningGate === "CLEARED"
        ? "Screening already cleared for this case — continue to CDD Typing in the workspace panel."
        : "Still waiting on screening resolution — see the workspace panel on the right.");
      return;
    }
    if(state.kycWave1){
      renderKycWave1Draft({silent:true});
      addMessage("bot", "Picking up at Wave 1 — see the workspace panel on the right.");
      return;
    }
    // Nothing staged locally for this case this session — genuinely a fresh start.
    startKycCase(false, KYC_CASE.name);
  }

  function startKycCase(skipChat, companyName){
    state.uploadedFiles = [];
    state.inProgressKyc = null;
    resetKycWave1State();
    resetKycWave2State();
    state.kycScreeningGate = null;
    state.kycCaseComplete = false;
    resetCddTypingState();
    goView("kyc-wave1-upload");
    var effectiveName = companyName || KYC_CASE.name;
    var match = findRecordFor(effectiveName);
    pushRecent({name:effectiveName, ref: match ? match.ref : KYC_CASE.ref, tier: match ? match.tier : null, status:"Wave 1 in progress"});
    if(!skipChat){
      var lead = companyName
        ? '<p>Let\'s start KYC for <strong>'+esc(companyName)+'</strong>. Wave 1 — the tier-independent set — is requested upfront, before CDD typing is known. Upload what you have: Certificate of Incorporation, registry extract, Constitution, Register of Directors, board resolutions, specimen signature, government ID.</p>'
        : '<p>Let\'s start. Upload Wave 1 documents — the tier-independent set, requested before CDD typing is known.</p>';
      addMessage("bot", lead + buildUploadWidgetHtml("kyc-wave1"));
    }
  }

  function renderOnboardDraft(opts){
    opts = opts || {};
    ensureDraftState();
    setCanvasHeader("Confirmation gate — step 1 of 2 — " + COMPANY.name, "Fields — staged, not committed. Saved automatically.", "welcome");
    state.inProgressTpa = {name:COMPANY.name, ref:COMPANY.ref, mode:"onboard", label:"Onboarding draft"};
    state.gateStep = 1;
    renderGateStep1();
    hideGateStep2();
    if(opts.silent) return;

    addMessage("bot",
      '<p>Your onboarding draft for <strong>'+esc(COMPANY.name)+'</strong> is staged, not committed. Review the 24 fields (plus the derived expiry) in the workspace, then continue to screening — one gate, two steps.</p>',

    );

  function renderRenewDelta(opts){
    opts = opts || {};
    setCanvasHeader("Renewal — what changed", COMPANY.name + " · " + COMPANY.ref + " · saved automatically", "welcome");

    var rows = RENEW_CHANGED.map(function(f){
      return '<tr class="'+(f.highRisk?"high-risk":"")+'"><td>'+esc(f.label)+(f.highRisk?' <span class="badge tier-high">High-risk edit</span>':'')+'</td>'+
        '<td><span class="delta-before">'+esc(f.before)+'</span></td>'+

        '<td><button type="button" class="cite-link" data-action="open-citation" data-source="'+esc(f.source)+'" data-snippet="">'+icon("doc")+' '+esc(f.source)+'</button></td></tr>';
    }).join("");

      '<table class="data-table"><thead><tr><th scope="col">Field</th><th scope="col">Previous value</th><th scope="col">New value</th><th scope="col">Source</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    html += '<div class="panel"><h2>New documents attached</h2>'+RENEW_NEW_DOCS.map(function(d){return '<div class="check-row">'+icon("doc")+'<div class="crow-title">'+esc(d)+'</div></div>';}).join("")+'</div>';
    html += '<div class="panel"><h2>Newly screened parties</h2>'+RENEW_NEW_SCREENED.map(function(d){return '<div class="check-row">'+icon("check")+'<div class="crow-title">'+esc(d)+'</div></div>';}).join("")+'</div>';
    html += '<div class="inline-actions"><button type="button" class="btn primary" data-action="go-view" data-view="onboard-draft-from-renew">Continue to the same confirmation gate &rarr;</button></div>';
    $("#canvas-body").innerHTML = html;
    if(opts.silent) return;

    addMessage("bot",
      '<p>'+esc(COMPANY.name)+'\'s renewal has a delta ready — one changed field (<strong>Shareholders</strong>) is flagged high-risk-to-edit. Same single gate, same commit — nothing goes anywhere else.</p>'+
      '<p>'+icon("warn")+' Chen Bo Rui is a newly disclosed beneficial owner (15%) and will be screened before this renewal can commit.</p>',
      {handoff:true}
    );
  }

  function renderStatus(){
    ensureDraftState();
    setCanvasHeader("Status", "Read-only. The only action is Amend.", "welcome");
    var score = computeRiskScore();
    var expiryField = state.draftFields.expiry;
    var committed = state.recordStatus === "committed";
    var expiry = committed ? (expiryField.expiryOverride || computeExpiry(score.tier)) : null;
    var openItems = computeOpenItems();
    var days = expiry ? daysBetween(ANCHOR_DATE, expiry) : null;

    var html = '<div class="panel status-card">'+
      '<div class="status-row"><span class="k">Company</span><span class="v">'+esc(COMPANY.name)+'</span></div>'+
      '<div class="status-row"><span class="k">Reference</span><span class="v mono">'+esc(COMPANY.ref)+'</span></div>'+
      '<div class="status-row"><span class="k">Record status</span><span class="v">'+esc(state.recordStatus)+'</span></div>'+
      '<div class="status-row"><span class="k">Risk score</span><span class="v">'+score.total+' &rarr; '+tierBadge(score.tier)+'</span></div>'+
      '<div class="status-row"><span class="k">Screening</span><span class="v">'+(state.parties ? partiesInScope().filter(function(p){return p.screening.confirmed||p.screening.override;}).length+" of "+partiesInScope().length+" resolved" : "Not yet run")+'</span></div>'+
      '<div class="status-row"><span class="k">Expiry</span><span class="v">'+(expiry ? esc(fmtDate(expiry))+' — '+(days<0?Math.abs(days)+" days overdue":days+" days remaining") : "—")+'</span></div>'+
      (openItems.hasOpenItems ? '<div class="status-row"><span class="k">Open items</span><span class="v">'+icon("warn")+' HAS OPEN ITEMS</span></div>' : '<div class="status-row"><span class="k">Open items</span><span class="v">None</span></div>')+
      '<div class="readonly-note">'+icon("info")+' Read-only summary — no approval, activation, or screening decisions happen on this screen.</div>'+
      (openItems.hasOpenItems ? '<div class="readonly-note">'+icon("warn")+' '+esc(openItems.reasons.join("; "))+'</div>' : '')+
      '<div class="inline-actions" style="margin-top:12px;">'+
        (committed ? '<button type="button" class="btn primary" data-action="open-amend">Amend &rarr;</button>' : '<span class="mono" style="font-size:11.5px;color:var(--color-muted);">Amend is available once the record is committed.</span>')+
      '</div>'+
    '</div>';

    if(state.committedVersions.length){
      html += '<div class="panel"><h2>History</h2><table class="data-table"><thead><tr><th scope="col">Version</th><th scope="col">Tier</th><th scope="col">Expiry</th><th scope="col">When</th></tr></thead><tbody>'+
        state.committedVersions.map(function(v){
          return '<tr><td>'+esc(v.versionLabel)+'</td><td>'+tierBadge(v.tier)+'</td><td class="mono">'+esc(fmtDate(v.expiry))+'</td><td class="mono">'+esc(v.time)+'</td></tr>';
        }).join("")+
      '</tbody></table></div>';

  }

  /* ============================================================
     AMEND (TPA PRD §9.6) — corrects what the record should always have said. Not a
     renewal: no new cycle, no expiry change unless explicitly overridden. Opens the
     committed values editable; a scoring-field edit re-tiers, an identity edit
     re-screens; commits a new version on the SAME record id.
     ============================================================ */
  function renderAmend(){
    ensureDraftState();
    setCanvasHeader("Amend — " + COMPANY.name, "Correcting an existing value — not a renewal. No new cycle, no expiry change unless overridden.", "status");
    state.amendOpen = true;
    var html = '<div class="info-banner">'+icon("info")+"<div>The committed values open editable with their citations. Documents aren't re-extracted unless you ask. A scoring-field edit (3/18/20) re-tiers the record; an identity edit (9/8/10) re-screens that party. This commits a new version on the same record — history shows both.</div></div>";
    html += '<div class="panel">';
    TPA_FIELD_DEFS.forEach(function(f){
      html += fieldCardHtml(f);
    });
    html += '</div>';
    html += '<div class="panel"><h2>Reason for amendment</h2><textarea id="amend-reason" class="field-edit-input" rows="2" placeholder="e.g. Registered address was mistyped at onboarding" style="width:100%;"></textarea></div>';
    var blocking = uboBlockingParties();
    if(blocking.length){
      html += '<div class="info-banner" style="background:var(--color-danger-bg);border-color:var(--color-danger-border);color:var(--color-danger-fg);">'+icon("warn")+'<div>Commit blocked — the ownership chain behind '+blocking.map(function(p){return esc(p.name);}).join(", ")+' is still unresolved and this amendment is now at HIGH tier. Resolve it from the screening panel before saving.</div></div>';
    }
    html += '<div class="inline-actions">'+
      '<button type="button" class="btn primary" data-action="amend-save" '+(blocking.length?"disabled":"")+'>Save amendment &amp; commit new version</button>'+
      '<button type="button" class="btn subtle" data-action="go-view" data-view="status">Cancel</button>'+
    '</div>';
    $("#canvas-body").innerHTML = html;
  }
  function saveAmendment(){
    var reasonInp = document.getElementById("amend-reason");
    var reason = reasonInp ? reasonInp.value.trim() : "";
    if(!reason){ toast("A reason for the amendment is required — it's captured and logged."); return; }
    var blocking = uboBlockingParties();
    if(blocking.length){ toast("Resolve the unresolved ownership chain before this amendment can commit."); return; }
    var score = computeRiskScore();
    var expiryField = state.draftFields.expiry;
    var expiry = expiryField.expiryOverride || computeExpiry(score.tier);
    var openItems = computeOpenItems();
    state.confirmationLog.push({type:"amend_reason", reason:reason, actor:"Da'yl Tan", time:"just now"});
    var version = {
      versionLabel: "Amendment " + state.committedVersions.length,
      tier: score.tier, score: score, expiry: expiry,
      confirmationLog: state.confirmationLog.slice(),
      time: "just now", reason: reason
    };
    state.committedVersions.push(version);
    var existing = THIRD_PARTIES.filter(function(tp){ return tp.ref === COMPANY.ref; })[0];
    if(existing){
      existing.tier = score.tier; existing.expiry = expiry;
      existing.openItems = openItems.hasOpenItems; existing.openItemsWhy = openItems.reasons.join("; ");
      existing.cachedAt = "Just now";
    }
    state.amendOpen = false;
    goView("status");
    addMessage("bot",
      '<p><strong>Amendment committed</strong> — a new version on the same record, <strong>'+esc(COMPANY.ref)+'</strong>. Reason: “'+esc(reason)+'”. History now shows both versions.</p>'+
      '<p>Base date for expiry stays the original commit — only a renewal restarts the clock. Current expiry: <strong>'+esc(fmtDate(expiry))+'</strong>.</p>',
      {handoff:true}
    );
  }

  function renderReviewPack(){
    ensureDraftState();
    setCanvasHeader("Review pack", COMPANY.name + " · one row per field, available to any user", "welcome");
    var rows = TPA_FIELD_DEFS.map(function(f){
      var st = state.draftFields[f.key];
      var dv = displayFieldValue(f, st);
      var valueCell = (!dv && f.cls === "judgment")
        ? '<span style="color:var(--color-warning-fg);">'+icon("warn")+' Needs confirmation</span>'
        : esc(dv || "—");
      return '<tr><td>'+f.n+'. '+esc(f.label)+'</td><td>'+valueCell+'</td>'+
        '<td>'+citeBtn(f)+'</td>'+

  var drawerReturnFocus = null;
  function drawerFocusables(){
    return Array.prototype.slice.call(
      $("#drawer").querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')
    ).filter(function(el){ return !el.disabled && el.offsetParent !== null; });

  function openDrawer(title, bodyHtml){
    drawerReturnFocus = document.activeElement;
    $("#drawer-title").innerHTML = title;
    $("#drawer-body").innerHTML = bodyHtml;
    $("#drawer").classList.add("open");
    $("#drawer-backdrop").classList.add("open");
    // Move focus into the dialog (a11y: focus management for a modal).
    var focusables = drawerFocusables();
    (focusables[0] || $("#drawer")).focus();
  }
  function closeDrawer(){
    $("#drawer").classList.remove("open");
    $("#drawer-backdrop").classList.remove("open");
    // Return focus to whatever opened the drawer.
    if(drawerReturnFocus && typeof drawerReturnFocus.focus === "function"){ drawerReturnFocus.focus(); }
    drawerReturnFocus = null;
  }
  function isDrawerOpen(){ return $("#drawer").classList.contains("open"); }
  // Esc to close; Tab wraps focus within the open dialog (focus trap).
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && state.tpPageOpen && !isDrawerOpen()){ closeThirdPartiesPage(); return; }
    if(e.key === "Escape" && state.kycPageOpen && !isDrawerOpen()){ closeKycCasesPage(); return; }
    if(!isDrawerOpen()) return;
    if(e.key === "Escape"){ e.preventDefault(); closeDrawer(); return; }
    if(e.key === "Tab"){
      var f = drawerFocusables();
      if(!f.length) return;
      var first = f[0], last = f[f.length-1];
      if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  });
