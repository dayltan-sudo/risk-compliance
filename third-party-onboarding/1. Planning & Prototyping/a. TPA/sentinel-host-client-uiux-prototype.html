  function renderKycProcessing(mode){
    setCanvasHeader("Processing Wave 1 — " + KYC_CASE.name, "Matching your documents against the Wave 1 checklist.");
    var steps = [
      {id:"received", label:"Documents received ("+state.uploadedFiles.length+" files)"},
      {id:"extract", label:"Extracting fields from documents"},
      {id:"match", label:"Matching against the Wave 1 checklist"},
      {id:"stage", label:"Staging case in RCTP"}
    ];
    var html = '<div class="progress-tracker" id="ptrack">'+steps.map(function(s,i){
      return '<div class="ptrack-step pending" data-step="'+s.id+'" style="--i:'+i+'"><span class="ptrack-icon">'+(i+1)+'</span><span class="ptrack-label">'+esc(s.label)+'</span></div>';
    }).join("")+'</div>';
    $("#canvas-body").innerHTML = html;
    runKycProcessingSequence(steps);
  }

  // Mirrors runProcessingSequence's tick loop exactly (kept as a separate function rather
  // than a shared abstraction so Phase 1 doesn't risk the already-tested TPA sequence).
  function runKycProcessingSequence(steps){
    var i = 0;
    function stepEl(id){ return document.querySelector('.ptrack-step[data-step="'+id+'"]'); }
    function mark(id, cls, iconName){
      var e = stepEl(id);
      if(!e) return;
      e.className = "ptrack-step " + cls;
      if(iconName){ e.querySelector(".ptrack-icon").innerHTML = icon(iconName); }
    }
    function tick(){
      if(i > 0){ mark(steps[i-1].id, "done", "check"); }
      if(i < steps.length){
        mark(steps[i].id, "active", "spinner");
        var cur = i;
        setTimeout(function(){ i = cur + 1; tick(); }, 750);
      } else {
        setTimeout(function(){ renderKycWave1Draft(); }, 350);
      }
    }
    tick();
  }

  // Runtime per-item state for the Wave 1 checklist (mirrors ensureDraftState/draftFields'
  // pattern for TPA fields) — confirm/unconfirm, replace/remove the attached document.
  // Seeded from WAVE1_CHECKLIST once per case; startKycCase resets it for a fresh case.
  function ensureKycWave1State(){
    if(state.kycWave1) return;
    state.kycWave1 = {};
    WAVE1_CHECKLIST.forEach(function(it){
      state.kycWave1[it.item] = {
        item: it.item, group: it.group, label: it.label,
        status: it.status, confidence: it.confidence || null,
        source: it.source || null, snippet: it.snippet || null, note: it.note || null,
        mandatory: it.mandatory,
        confirmed: false,
        justRemoved: false,      // true right after "Remove" — shows the inline Undo
        removedSnapshot: null    // full prior record, restored verbatim on Undo
      };
    });
  }
  function resetKycWave1State(){ state.kycWave1 = null; }

  // Runtime Wave 2 checklist state — same shape/mechanics as Wave 1's (ensureKycWave1State),
  // tier-scoped: Standard gets WAVE2_STANDARD_ITEMS only, Enhanced adds the 3 Q5 items.
  // kycWave2Defs is kept alongside so render/summary code has a stable definition order to
  // iterate (state.kycWave2 itself is keyed by item id, not guaranteed-ordered by content).
  function ensureKycWave2State(tier){
    if(state.kycWave2) return;
    state.kycWave2Defs = WAVE2_STANDARD_ITEMS.concat(tier === "Enhanced" ? WAVE2_ENHANCED_ONLY_ITEMS : []);
    state.kycWave2 = {};
    state.kycWave2Defs.forEach(function(it){
      state.kycWave2[it.item] = {
        item: it.item, group: it.group, label: it.label,
        status: it.status, confidence: it.confidence || null,
        source: it.source || null, snippet: it.snippet || null, note: it.note || null,
        mandatory: it.mandatory,
        confirmed: false, justRemoved: false, removedSnapshot: null
      };
    });
  }
  function resetKycWave2State(){ state.kycWave2 = null; state.kycWave2Defs = null; }
  // Shared re-render dispatch for the per-item document actions (confirm/replace/remove/undo),
  // which are wired to a single delegated click handler that doesn't know which wave it's on
  // without checking the button's data-wave attribute.
  function kycRerenderWave(wave, opts){
    if(String(wave) === "2"){ renderKycWave2Draft(opts); } else { renderKycWave1Draft(opts); }
  }

  function renderKycWave2Draft(opts){
    opts = opts || {};
    var tier = state.resolvedCddTier;
    ensureKycWave2State(tier);
    setCanvasHeader("Wave 2 — " + KYC_CASE.name, "Tier-scoped checklist (" + esc(tier) + ") · staged, not submitted.", "welcome");
    state.inProgressKyc = {name:KYC_CASE.name, ref:KYC_CASE.ref, mode:"kyc-wave2", label:"Wave 2 checklist"};

    var groups = {}, order = [];
    state.kycWave2Defs.forEach(function(def){
      var it = state.kycWave2[def.item];
      if(!groups[it.group]){ groups[it.group] = []; order.push(it.group); }
      groups[it.group].push(it);
    });
    var html = '<div class="info-banner">'+icon("info")+'<div>Wave 2 is scoped to the resolved tier ('+esc(tier)+') — this is the only additional round; nothing further gets requested after this one.</div></div>';
    html += '<div class="panel">';
    order.forEach(function(g){
      html += '<div class="field-section-title">'+esc(g)+'</div>';
      html += groups[g].map(function(it){ return checklistItemCardHtml(it, 2); }).join("");
    });
    html += '</div>';
    $("#canvas-body").innerHTML = html;
    if(opts.silent) return;

    var items = state.kycWave2Defs.map(function(def){ return state.kycWave2[def.item]; });
    var open = items.filter(function(it){ return it.status !== "present"; });
    var summary = open.length
      ? open.length+" of "+items.length+" primary items are still open from what's on file."
      : "Everything is accounted for from what's on file.";
    addMessage("bot",
      "<p>Wave 2 is now open — <strong>"+esc(tier)+"</strong> tier, "+items.length+" items (this is the only additional round; nothing further gets requested after this one). "+summary+"</p>"+
      '<div class="inline-actions">'+
        '<button type="button" class="btn primary" data-action="kyc-confirm-wave2">Confirm Wave 2</button>'+
        '<button type="button" class="btn" data-action="go-view" data-view="welcome">Not yet — let me check something</button>'+
      '</div>'
    );
  }

  function renderKycWave1Draft(opts){
    opts = opts || {};
    ensureKycWave1State();
    setCanvasHeader("Wave 1 — " + KYC_CASE.name, "Staged, not submitted · saved automatically.", "welcome");
    state.inProgressKyc = {name:KYC_CASE.name, ref:KYC_CASE.ref, mode:"kyc-wave1", label:"Wave 1 checklist"};

    var groups = {}, order = [];
    WAVE1_CHECKLIST.forEach(function(def){
      var it = state.kycWave1[def.item];
      if(!groups[it.group]){ groups[it.group] = []; order.push(it.group); }
      groups[it.group].push(it);
    });
    var html = '<div class="info-banner">'+icon("info")+'<div>Wave 1 is the tier-independent document set — requested upfront, before CDD typing is known.</div></div>';
    html += '<div class="panel">';
    order.forEach(function(g){
      html += '<div class="field-section-title">'+esc(g)+'</div>';
      html += groups[g].map(function(it){ return checklistItemCardHtml(it, 1); }).join("");
    });
    html += '</div>';
    // Locked Wave 2 stub (KYC Orchestrator.md §5 / KYC PRD §5) — rendered alongside Wave 1
    // rather than omitted, so the reviewer sees the case's full shape, not just what's open now.
    html += '<div class="panel" style="opacity:.72;">'+
      '<h2>'+icon("lock")+' Wave 2 <span style="font-weight:400;color:var(--color-muted);">(locked — unlocks after CDD Typing)</span></h2>'+
      '<div class="panel-sub" style="margin-bottom:0;">Contents depend on the resolved tier — Standard: 8 items · Enhanced: adds 3 more. Not requestable yet.</div>'+
    '</div>';
    $("#canvas-body").innerHTML = html;
    if(opts.silent) return;

    var items = WAVE1_CHECKLIST.map(function(def){ return state.kycWave1[def.item]; });
    var open = items.filter(function(it){ return it.status !== "present"; });
    var mandatoryOpen = open.filter(function(it){ return it.mandatory !== false; });
    var summary = mandatoryOpen.length
      ? mandatoryOpen.length+" mandatory item"+(mandatoryOpen.length>1?"s are":" is")+" still open — take a look in the canvas before confirming."
      : "Everything mandatory is accounted for.";
    addMessage("bot",
      "<p>I've matched your "+state.uploadedFiles.length+" documents against the "+WAVE1_CHECKLIST.length+" Wave 1 checklist items. "+summary+"</p>"+
      '<div class="inline-actions">'+
        '<button type="button" class="btn primary" data-action="kyc-confirm-wave1">Confirm Wave 1</button>'+
        '<button type="button" class="btn" data-action="go-view" data-view="welcome">Not yet — let me check something</button>'+
      '</div>'
    );
  }

  /* ============================================================
     SCREENING GATE (KYC PRD §7.3) — a structural difference from TPA:
     resolution happens entirely outside this system (no MCP-driven source).
     Content-free status only — no hit data, scores, or match detail, ever.
     ============================================================ */
  function renderKycScreeningGate(){
    setCanvasHeader("CDD Typing — " + KYC_CASE.name, "Locked until screening resolution clears.", "welcome");
    state.inProgressKyc = {name:KYC_CASE.name, ref:KYC_CASE.ref, mode:"kyc-screening", label:"Screening gate"};
    var cleared = state.kycScreeningGate === "CLEARED";
    var html = '<div class="panel status-card">'+
      '<div class="status-row"><span class="k">Case</span><span class="v">'+esc(KYC_CASE.name)+'</span></div>'+
      '<div class="status-row"><span class="k">Reference</span><span class="v mono">'+esc(KYC_CASE.ref)+'</span></div>'+
      '<div class="status-row"><span class="k">Status</span><span class="v">'+(cleared ? '<span class="badge confidence-high">Screening cleared</span>' : '<span class="badge confidence-medium">Waiting on screening resolution</span>')+'</span></div>'+
      '<div class="readonly-note">'+icon("info")+' No hit data, match scores, or match detail is shown here, ever — this is purely an unlock gate. Resolution happens entirely outside this chat (KYC PRD §7.3, §2.1).</div>'+
      '<div class="inline-actions" style="margin-top:14px;">'+
        (cleared
          ? '<button type="button" class="btn primary" data-action="kyc-open-cdd-typing">Continue to CDD Typing &rarr;</button>'
          : '<button type="button" class="btn primary" data-action="kyc-clear-screening" title="Demo only — in production this clears when a human resolves the screening hit outside this chat.">[Simulated] Screening cleared</button>')+
      '</div>'+
    '</div>';
    $("#canvas-body").innerHTML = html;
  }

  /* ============================================================
     CDD TYPING QUESTIONNAIRE (KYC PRD §7.3) — grouped per TPA PRD §5's field-volume
     guidance (About = Q1-4, Risk Factors = Q5-19 collapsed by default). One submit,
     not per-question confirm — this is a questionnaire, not a field-review ledger.
     ============================================================ */
  function ensureCddTypingState(){
    if(state.cddTyping) return;
    state.cddTyping = {};
    CDD_TYPING_QUESTIONS.forEach(function(q){
      state.cddTyping[q.q] = {value: q.value};
    });
  }
  function resetCddTypingState(){
    state.cddTyping = null;
    state.cddRiskExpanded = false;
    state.resolvedCddTier = null;
  }
  function resolveCddTier(){
    var aboutYes = CDD_TYPING_QUESTIONS.filter(function(q){ return q.group === "about"; })
      .some(function(q){ return state.cddTyping[q.q].value === "Yes"; });
    if(aboutYes) return {tier:"Simplified", trigger:null};
    var riskHit = CDD_TYPING_QUESTIONS.filter(function(q){ return q.group === "risk"; })
      .filter(function(q){ return state.cddTyping[q.q].value === "Yes"; });
    if(riskHit.length) return {tier:"Enhanced", trigger:riskHit[0]};
    return {tier:"Standard", trigger:null};
  }
  function cddQuestionRowHtml(q){
    var st = state.cddTyping[q.q];
    var suggested = !st.value && q.suggested;
    var needsInput = !st.value && !q.suggested;
    var rowClass = suggested ? "suggested" : needsInput ? "needs-input" : "";
    var displayVal = st.value; // the suggestion is never treated as an answer until picked
    var note = suggested
      ? '<div class="cdd-note">Suggested: '+esc(q.suggested.value)+' — '+esc(q.suggested.basis)+'</div>'
      : (q.note ? '<div class="cdd-note" style="color:var(--color-warning-fg);">'+esc(q.note)+'</div>' : "");
    return '<div class="cdd-row '+rowClass+'">'+
      '<span class="cdd-q">Q'+esc(q.q)+'</span>'+
      '<div class="cdd-body"><div class="cdd-label">'+esc(q.label)+'</div>'+note+'</div>'+
      '<div class="cdd-answer-toggle">'+
        '<button type="button" class="cdd-answer-btn" data-action="cdd-answer" data-q="'+esc(q.q)+'" data-value="Yes" aria-pressed="'+(displayVal==="Yes")+'">Yes</button>'+
        '<button type="button" class="cdd-answer-btn" data-action="cdd-answer" data-q="'+esc(q.q)+'" data-value="No" aria-pressed="'+(displayVal==="No")+'">No</button>'+
      '</div>'+
    '</div>';
  }
  function renderKycCddTyping(opts){
    opts = opts || {};
    ensureCddTypingState();
    setCanvasHeader("CDD Typing — " + KYC_CASE.name, "19 questions · staged, not submitted.", "welcome");
    if(!state.resolvedCddTier){
      state.inProgressKyc = {name:KYC_CASE.name, ref:KYC_CASE.ref, mode:"kyc-cdd-typing", label:"CDD Typing"};
    }

    if(state.resolvedCddTier){
      var tierNote = state.resolvedCddTier === "Simplified"
        ? "Simplified-eligible — no Wave 2 applies. This case moves straight to review."
        : "Wave 2 is next.";
      var html = '<div class="info-banner" style="background:var(--color-success-bg);border-color:var(--color-success-border);color:var(--color-success-fg);">'+icon("check")+
        '<div><strong>CDD Typing staged.</strong> Resolved tier: <strong>'+esc(state.resolvedCddTier)+'</strong>. '+esc(tierNote)+'</div></div>';
      html += '<div class="panel"><h2>Resolved tier</h2>'+tierBadge(state.resolvedCddTier === "Enhanced" ? "high" : state.resolvedCddTier === "Standard" ? "medium" : "low")+
        '<div class="panel-sub" style="margin-top:8px;">Answers are staged, not submitted — read-only below.</div></div>';
      ["about","risk"].forEach(function(g){
        html += '<div class="field-section-title">'+(g==="about" ? "About "+esc(KYC_CASE.name)+" (Q1–4)" : "Risk Factors (Q5–19)")+'</div><div class="panel">';
        html += CDD_TYPING_QUESTIONS.filter(function(q){ return q.group===g; }).map(function(q){
          var v = state.cddTyping[q.q].value;
          return '<div class="cdd-row"><span class="cdd-q">Q'+esc(q.q)+'</span><div class="cdd-body"><div class="cdd-label">'+esc(q.label)+'</div></div>'+
            '<span class="badge '+(v==="Yes"?"tier-high":"neutral")+'">'+esc(v||"—")+'</span></div>';
        }).join("");
        html += '</div>';
      });
      $("#canvas-body").innerHTML = html;
      return;
    }

    var aboutHtml = CDD_TYPING_QUESTIONS.filter(function(q){ return q.group === "about"; }).map(cddQuestionRowHtml).join("");
    var riskQs = CDD_TYPING_QUESTIONS.filter(function(q){ return q.group === "risk"; });
    var riskAnswered = riskQs.filter(function(q){ return state.cddTyping[q.q].value; }).length;
    var riskHtml = riskQs.map(cddQuestionRowHtml).join("");

    var html = '<div class="info-banner">'+icon("info")+'<div>No screening-derived recommendation flags arose for this case — Q5 and Q11 are the only questions eligible for one, and neither triggered.</div></div>';
    html += '<div class="panel">';
    html += '<div class="field-section-title" style="margin-top:0;">About '+esc(KYC_CASE.name)+' (Q1–4)</div>'+aboutHtml;
    html += '<button type="button" class="cdd-group-toggle" data-action="cdd-toggle-risk" aria-expanded="'+state.cddRiskExpanded+'">'+
      '<span class="field-section-title">Risk Factors (Q5–19) — '+riskAnswered+' of '+riskQs.length+' answered</span>'+
      '<svg class="cdd-caret" width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
    '</button>';
    if(state.cddRiskExpanded){ html += riskHtml; }
    else { html += '<div class="panel-sub" style="margin:0 0 8px;">19 mostly-No questions — collapsed by default (field-volume guidance). Expand to review, or answer Q12 directly below.</div>'; }
    // Q12 has no default and no suggestion — always surfaced even while the group is
    // collapsed, so the one question that actually needs input is never hidden.
    if(!state.cddRiskExpanded){
      var q12 = CDD_TYPING_QUESTIONS.filter(function(q){ return q.q === "12"; })[0];
      html += cddQuestionRowHtml(q12);
    }
    html += '</div>';
    html += '<div class="inline-actions" style="margin-top:4px;"><button type="button" class="btn primary" data-action="cdd-submit">Submit CDD Typing</button></div>';
    $("#canvas-body").innerHTML = html;
    if(opts.silent) return;
  }

  /* ============================================================
     CASE STATUS (KYC PRD §7.10) — read-only, no screening-hit content beyond the
     content-free gate label. Stage vocabulary matches the PRD's own six states.
     ============================================================ */
  function kycCaseStage(){
    if(state.kycCaseComplete) return "Complete";
    if(state.resolvedCddTier === "Simplified") return "Review";
    if(state.resolvedCddTier) return "Wave 2 chase";
    if(state.kycScreeningGate === "CLEARED") return "CDD typing";
    if(state.kycScreeningGate === "PENDING") return "Waiting on screening resolution";
    if(state.kycWave1) return "Wave 1 chase";
    return "Not started";
  }
  // Counts mandatory items only — a non-mandatory Missing item (e.g. Wave 1's 1.3,
  // "where applicable") isn't outstanding work, so it shouldn't inflate this number.
  function kycOutstandingCount(){
    function openMandatory(store){
      if(!store) return 0;
      return Object.keys(store).filter(function(k){ return store[k].status !== "present" && store[k].mandatory !== false; }).length;
    }
    return openMandatory(state.kycWave1) + openMandatory(state.kycWave2);
  }
  function renderKycStatus(){
    setCanvasHeader("Case status", "Read-only. No screening-hit content is shown here (KYC PRD §7.10).", "welcome");
    var html = '<div class="panel status-card">'+
      '<div class="status-row"><span class="k">Case</span><span class="v">'+esc(KYC_CASE.name)+'</span></div>'+
      '<div class="status-row"><span class="k">Reference</span><span class="v mono">'+esc(KYC_CASE.ref)+'</span></div>'+
      '<div class="status-row"><span class="k">Stage</span><span class="v">'+esc(kycCaseStage())+'</span></div>'+
      '<div class="status-row"><span class="k">Resolved CDD tier</span><span class="v">'+(state.resolvedCddTier ? esc(state.resolvedCddTier) : "—")+'</span></div>'+
      '<div class="status-row"><span class="k">Outstanding items</span><span class="v">'+kycOutstandingCount()+'</span></div>'+
      '<div class="readonly-note">'+icon("info")+' Read-only summary — no hit data, match scores, or adjudication controls appear here, ever.</div>'+
    '</div>';
    $("#canvas-body").innerHTML = html;
  }
  function startKycStatus(){
    goView("welcome");
    renderKycStatus();
    pushRecent({name:KYC_CASE.name, ref:KYC_CASE.ref, tier:null, status:"Status checked"});
    addMessage("user", "Where is " + KYC_CASE.name + "'s KYC?");
    setTimeout(function(){ addMessage("bot", "Here's the latest read-only summary — see the workspace panel on the right."); }, 400);
  }

  /* ============================================================
     REVIEW PACK & EXCEPTION REPORT (KYC PRD §7.9, R&C) — mirrors TPA's Review Pack
     but grouped by wave/section with a mandatory-review-only filter, since a case can
     carry up to ~39 items across Wave 1 + CDD Typing + Wave 2 combined (the gap the
     Sentinel Output 5 walkthrough flagged in FM&I KYC - Output Templates.md, now fixed
     there and here).
     ============================================================ */
  function kycReviewPackRows(){
    var rows = [];
    if(state.kycWave1){
      WAVE1_CHECKLIST.forEach(function(def){
        var it = state.kycWave1[def.item];
        rows.push({section:"Wave 1 — "+it.group, id:it.item, label:it.label, value:checklistStatusBadge(it.status), source:it.source, snippet:it.snippet, confidence:it.confidence, mandatory: it.mandatory !== false});
      });
    }
    if(state.cddTyping){
      CDD_TYPING_QUESTIONS.forEach(function(q){
        var v = state.cddTyping[q.q].value;
        rows.push({section:"CDD Typing — "+(q.group==="about"?"About":"Risk Factors"), id:"Q"+q.q, label:q.label, value:'<span class="badge '+(v==="Yes"?"tier-high":"neutral")+'">'+esc(v||"—")+'</span>', source:null, snippet:null, confidence:null, mandatory:true});
      });
    }
    if(state.kycWave2){
      state.kycWave2Defs.forEach(function(def){
        var it = state.kycWave2[def.item];
        rows.push({section:"Wave 2 — "+it.group, id:it.item, label:it.label, value:checklistStatusBadge(it.status), source:it.source, snippet:it.snippet, confidence:it.confidence, mandatory: it.mandatory !== false});
      });
    }
    return rows;
  }
  function renderKycReviewPack(){
    setCanvasHeader("Review pack", KYC_CASE.name + " · grouped by wave/section, mandatory-review filter available", "welcome");
    var rows = kycReviewPackRows();
    if(!rows.length){
      $("#canvas-body").innerHTML = '<div class="empty-state">'+icon("inbox")+'<h2>Nothing staged yet</h2><p>Start a KYC case (Wave 1) before a review pack has anything to show.</p></div>';
      return;
    }
    var filter = state.kycReviewFilter;
    var mandatoryCount = rows.filter(function(r){ return r.mandatory; }).length;
    var filterHtml = [["all","All items ("+rows.length+")"],["mandatory","Mandatory-review only ("+mandatoryCount+")"]].map(function(f){
      return '<button type="button" class="filter-chip" data-action="kyc-review-filter" data-filter="'+f[0]+'" aria-pressed="'+(filter===f[0])+'">'+esc(f[1])+'</button>';
    }).join("");
    var filtered = filter === "mandatory" ? rows.filter(function(r){ return r.mandatory; }) : rows;
    var groups = {}, order = [];
    filtered.forEach(function(r){ if(!groups[r.section]){ groups[r.section] = []; order.push(r.section); } groups[r.section].push(r); });
    var html = '<div class="info-banner">'+icon("info")+"<div>Evidence only — no verdict or “matches” column. The human reviewer makes the call.</div></div>";
    html += '<div class="filter-row">'+filterHtml+'</div>';
    if(!order.length){
      html += '<div class="empty-state" style="padding:34px 20px;">'+icon("check")+'<h2>Nothing in this filter</h2></div>';
    }
    order.forEach(function(g){
      var body = groups[g].map(function(r){
        return '<tr><td>'+esc(r.id)+' '+esc(r.label)+'</td><td>'+r.value+'</td>'+
          '<td>'+(r.source ? '<button type="button" class="cite-link" data-action="open-citation" data-source="'+esc(r.source)+'" data-snippet="'+esc(r.snippet||"")+'">'+icon("doc")+' '+esc(r.source)+'</button>' : '<span class="mono" style="font-size:11px;color:var(--color-muted);">—</span>')+'</td>'+
          '<td>'+(r.confidence ? confidenceBadge(r.confidence) : "—")+'</td>'+
          '<td>'+(r.mandatory ? '<span class="badge mandatory">Yes</span>' : "No")+'</td></tr>';
      }).join("");
      html += '<div class="panel"><h2 style="font-size:13px;">'+esc(g)+'</h2><table class="data-table"><thead><tr><th scope="col">Item</th><th scope="col">Value</th><th scope="col">Source reference</th><th scope="col">Confidence</th><th scope="col">Mandatory?</th></tr></thead><tbody>'+body+'</tbody></table></div>';
    });
    $("#canvas-body").innerHTML = html;
  }

  function renderKycExceptionReport(){
    setCanvasHeader("Exception report", KYC_CASE.name + " · " + KYC_CASE.ref, "welcome");
    var blanks = [], redflags = [], unconfirmed = [];
    [ [state.kycWave1, state.kycWave1 && WAVE1_CHECKLIST], [state.kycWave2, state.kycWave2Defs] ].forEach(function(pair){
      var store = pair[0], defs = pair[1];
      if(!store || !defs) return;
      defs.forEach(function(def){
        var it = store[def.item];
        if(it.status === "missing" && it.mandatory !== false){ blanks.push(it.item+" "+it.label); }
        if(it.status === "nonctc"){ redflags.push({label:it.item+" "+it.label, value: it.note || "Certification issue"}); }
        if(it.status === "present" && !it.confirmed){ unconfirmed.push(it.item+" "+it.label+" — on file, not yet confirmed by a reviewer"); }
      });
    });
    var html = '<div class="info-banner">'+icon("info")+'<div>A pre-sign-off checklist — not a pass/fail verdict.</div></div>';
    html += '<div class="panel">';
    html += '<div class="checklist-group"><h3>'+icon("warn")+' Blank required items</h3>'+
      (blanks.length ? blanks.map(function(b){ return '<label class="check-row"><input type="checkbox"><span><div class="crow-title">'+esc(b)+'</div></span></label>'; }).join("") : '<div class="crow-sub" style="padding:4px 2px;">None open.</div>')+'</div>';
    html += '<div class="checklist-group"><h3>'+icon("warn")+' Red-flag items</h3>'+
      (redflags.length ? redflags.map(function(r){ return '<label class="check-row redflag"><input type="checkbox"><span><div class="crow-title">'+esc(r.label)+'</div><div class="crow-sub">'+esc(r.value)+'</div></span></label>'; }).join("") : '<div class="crow-sub" style="padding:4px 2px;">None.</div>')+'</div>';
    html += '<div class="checklist-group"><h3>Unconfirmed items</h3>'+
      (unconfirmed.length ? unconfirmed.map(function(u){ return '<label class="check-row"><input type="checkbox"><span><div class="crow-title">'+esc(u)+'</div></span></label>'; }).join("") : '<div class="crow-sub" style="padding:4px 2px;">Nothing pending confirmation.</div>')+'</div>';
    html += '</div>';
    $("#canvas-body").innerHTML = html;
  }

  /* ---- Flow starters ---- */
  function promptStartKycCaseName(){
    goView("welcome");
    addMessage("bot", "<p>Which company or customer is this KYC case for? Type a name below, or pick from your recent cases.</p>" + buildNamePromptHtml("kyc-start"));
  }
  // §7.1-equivalent dedup check for KYC (KYC PRD §7.1) — same mechanism as TPA's startFind,
  // against the KYC case registry instead of the third-party registry.
  function startKycFind(companyName, opts){
    opts = opts || {};
    goView("kyc-find");
    var name = companyName || KYC_CASE.name;
    if(!opts.skipUserMsg){ addMessage("user", esc(companyName ? "Find " + companyName : "Find " + KYC_CASE.name)); }
    var match = findRecordFor(name);
    state.lastFindMatch = match;
    setTimeout(function(){
      if(match){
        // Prefer this session's own live status over the static cached-registry one —
        // otherwise re-finding a case you've already progressed past this session would
        // claim it's still at whatever stage the seed data says, undermining "Continue
        // this case" actually resuming correctly (resumeKycCase, below).
        var liveEntry = state.recentlyWorked.filter(function(r){ return r.ref === match.ref; })[0];
        var displayStatus = liveEntry ? liveEntry.status : match.status;
        pushRecent({name:match.name, ref:match.ref, tier:match.tier, status:displayStatus});
        addMessage("bot",
          '<p>Found it — <strong>'+esc(match.name)+'</strong>, <span class="mono">'+esc(match.ref)+'</span>, currently at <strong>'+esc(displayStatus)+'</strong>.</p>'+
          '<div class="inline-actions">'+
            '<button type="button" class="btn primary" data-action="kyc-continue-case" data-name="'+esc(match.name)+'">Continue this case</button>'+
          '</div>'
        );
      } else {
        addMessage("bot",
          '<p>No existing KYC case found for “<strong>'+esc(name)+'</strong>”.</p>'+
          '<div class="inline-actions"><button type="button" class="btn primary" data-action="kyc-start-new" data-name="'+esc(name)+'">Start new KYC case for “'+esc(name)+'”</button></div>'
        );
      }
    }, 500);
  }

  // "Continue this case" (Flow A's registry-match resume path) must pick up at whatever
  // stage the case actually reached this session, not silently restart Wave 1 — the gap
  // Sentinel Output 5 flagged ("Resume at Wave 2" chip) and left for a later phase.
  // Checked latest-stage-first since a case that reached Wave 2 also has kycWave1 set.
  function resumeKycCase(){
    goView("welcome");
    if(state.kycCaseComplete){
      renderKycStatus();
      addMessage("bot", "This case is already complete — here's the latest status. See the workspace panel on the right.");
      return;
    }
    if(state.kycWave2){
      renderKycWave2Draft({silent:true});
      addMessage("bot", "Picking up at Wave 2 — see the workspace panel on the right.");
      return;
    }
    if(state.resolvedCddTier){
      // Enhanced/Standard resolved but Wave 2 not yet opened (e.g. mid-transition)
      renderKycWave2Draft({silent:true});
      addMessage("bot", "Picking up at Wave 2 — see the workspace panel on the right.");
      return;
    }
    if(state.cddTyping){
      renderKycCddTyping({silent:true});
      addMessage("bot", "Picking up at CDD Typing — see the workspace panel on the right.");
      return;
    }
    if(state.kycScreeningGate){
      renderKycScreeningGate();
      addMessage("bot", state.kycScreeningGate === "CLEARED"
        ? "Screening already cleared for this case — continue to CDD Typing in the workspace panel."
        : "Still waiting on screening resolution — see the workspace panel on the right.");
      return;
    }
    if(state.kycWave1){
      renderKycWave1Draft({silent:true});
      addMessage("bot", "Picking up at Wave 1 — see the workspace panel on the right.");
      return;
    }
    // Nothing staged locally for this case this session — genuinely a fresh start.
    startKycCase(false, KYC_CASE.name);
  }

  function startKycCase(skipChat, companyName){
    function go(){
      state.uploadedFiles = [];
      state.inProgressKyc = null;
      resetKycWave1State();
      resetKycWave2State();
      state.kycScreeningGate = null;
      state.kycCaseComplete = false;
      resetCddTypingState();
      goView("kyc-wave1-upload");
      var effectiveName = companyName || KYC_CASE.name;
      var match = findRecordFor(effectiveName);
      pushRecent({name:effectiveName, ref: match ? match.ref : KYC_CASE.ref, tier: match ? match.tier : null, status:"Wave 1 in progress"});
      if(!skipChat){
        var lead = companyName
          ? '<p>Let\'s start KYC for <strong>'+esc(companyName)+'</strong>. Wave 1 — the tier-independent set — is requested upfront, before CDD typing is known. Upload what you have: Certificate of Incorporation, registry extract, Constitution, Register of Directors, board resolutions, specimen signature, government ID.</p>'
          : '<p>Let\'s start. Upload Wave 1 documents — the tier-independent set, requested before CDD typing is known.</p>';
        addMessage("bot", lead + buildUploadWidgetHtml("kyc-wave1"));
      }
    }
    requireBuConfirmation(go);
  }

  function renderComplianceScreening(mode){
    state.screeningMode = mode;
    var entities = screeningEntities(mode);

    var entityRows = entities.map(function(e){
      return '<tr><td>'+esc(e.name)+'</td><td>'+esc(e.type)+'</td><td>'+esc(e.relationship)+'</td></tr>';
    }).join("");

    var sourceRows = SANCTIONS_SOURCES.map(function(s){
      return '<tr><td>'+icon("check")+' '+esc(s.list)+'</td><td>'+esc(s.source)+'</td></tr>';
    }).join("");

    var resultRows = entities.map(function(e){
      var rec = state.remediation[e.name];
      var actionsHtml;
      if(e.status === "clear"){
        actionsHtml = '<span class="badge neutral">No action needed</span>';

        actionsHtml = '<span class="badge neutral">Recommended: '+esc(rec)+' · pending RCTP sync</span>';
      } else {
        actionsHtml = '<div class="inline-actions">'+
          '<button type="button" class="btn danger-outline" data-action="remediate" data-entity="'+esc(e.name)+'" data-verdict="Confirmed hit">Confirm hit</button>'+
          '<button type="button" class="btn" data-action="remediate" data-entity="'+esc(e.name)+'" data-verdict="False positive">Clear — false positive</button>'+
          '<button type="button" class="btn subtle" data-action="remediate" data-entity="'+esc(e.name)+'" data-verdict="Escalated">Escalate</button>'+
        '</div>';
      }
      var adverseHtml = e.adverseMedia
        ? '<button type="button" class="cite-link" data-action="open-adverse-media" data-entity="'+esc(e.name)+'" data-detail="'+esc(e.adverseMedia)+'">'+icon("doc")+' View</button>'
        : '<span style="color:var(--color-muted);">None found</span>';
      return '<tr class="'+(e.status==="hit"?"high-risk":"")+'">'+
        '<td>'+esc(e.name)+'<div class="sub" style="color:var(--color-muted);font-size:11px;">'+esc(e.relationship)+'</div></td>'+
        '<td>'+(e.listsHit ? esc(e.listsHit) : '—')+'</td>'+
        '<td class="mono">'+(e.matchScore!=null ? e.matchScore+'%' : '—')+'</td>'+
        '<td>'+screeningStatusBadge(e.status)+'</td>'+

        '<div><strong>Proposed — not in current MVP scope.</strong> Per PRD §7.9 the MVP is confirmation-only; showing hit results depends on an open question (§14.5): the handover records <em>no Dow Jones API to fetch hit data</em>. This concept is shown for discussion. Nothing here clears a hit — actions are recommendations synced to RCTP, where adjudication actually happens.</div></div>'+
      '<div class="panel"><h2>Extracted entities &amp; individuals screened ('+entities.length+')</h2>'+
        '<div class="panel-sub">Relationship to '+esc(COMPANY.name)+'.</div>'+
        '<table class="data-table"><thead><tr><th scope="col">Name</th><th scope="col">Type</th><th scope="col">Relationship</th></tr></thead><tbody>'+entityRows+'</tbody></table></div>'+
      '<div class="panel"><h2>Sanctions &amp; watchlists checked</h2>'+
        '<div class="panel-sub">Every entity above is screened against each list below.</div>'+

      '<div class="panel"><h2>Screening results summary</h2>'+
        '<div class="inline-actions" style="margin-bottom:14px;">'+
          '<span class="badge tier-low">'+counts.clear+' Clear</span>'+
          '<span class="badge tier-medium">'+counts.review+' Review</span>'+

        '<div class="inline-actions" style="margin-top:14px;">'+

  function renderDraftBody(){
    // At 30–50 real fields a flat list is unusable, so the draft is grouped (mandatory +
    // admin-by-domain) and filterable — including a jump to blank/low-confidence fields
    // (PRD §5 "designing for field volume").
    ensureDraftState();
    var all = DRAFT_MANDATORY.concat(DRAFT_ADMIN);
    var total = all.length;
    var attentionCount = all.filter(fieldNeedsAttention).length;
    var filter = state.draftFilter;
    var filters = [
      ["all","All fields ("+total+")"],
      ["mandatory","Mandatory-review only ("+DRAFT_MANDATORY.length+")"],
      ["attention","Needs attention ("+attentionCount+")"]
    ];
    function passes(f){ return filter === "attention" ? fieldNeedsAttention(f) : true; }

    // §10 resumability — make it visible that leaving is safe
    var html = '<div class="info-banner" style="background:var(--color-success-bg);border-color:var(--color-success-border);color:var(--color-success-fg);">'+icon("check")+'<div><strong>Draft saved automatically.</strong> You can leave and resume from the home screen — your edits and uploaded documents stay attached, nothing is submitted.</div></div>';
    html += '<div class="info-banner">'+icon("info")+'<div>Screening submitted automatically for entity, CEO, 2 directors, parent, 2 UBOs, per the RC003 risk tier. Results are adjudicated in RCTP — not shown here.</div></div>';

    html += '<div class="filter-row">'+filters.map(function(f){
      var att = f[0] === "attention" && attentionCount > 0 ? " attention" : "";
      return '<button type="button" class="filter-chip'+att+'" data-action="draft-filter" data-filter="'+f[0]+'" aria-pressed="'+(filter===f[0])+'">'+esc(f[1])+'</button>';
    }).join("")+'</div>';

    html += '<div class="panel">';

    var mand = DRAFT_MANDATORY.filter(passes);
    if(mand.length){
      html += '<div class="field-section-title">'+icon("warn")+' Mandatory review (R&C)</div>';
      html += mand.map(function(f){ return fieldCardHtml(f, "mandatory-review"); }).join("");
    }

    if(filter !== "mandatory"){
      // Administrative fields grouped by domain, preserving first-seen order
      var groups = {}, order = [];
      DRAFT_ADMIN.forEach(function(f){
        var g = f.group || "Administrative";
        if(!groups[g]){ groups[g] = []; order.push(g); }
        groups[g].push(f);
      });
      order.forEach(function(g){
        var fields = groups[g].filter(passes);
        if(!fields.length) return;
        html += '<div class="field-section-title">'+esc(g)+'</div>';
        html += fields.map(function(f){ return fieldCardHtml(f); }).join("");
      });
    }

    if(filter === "attention" && attentionCount === 0){
      html += '<div class="empty-state" style="padding:34px 20px;">'+icon("check")+'<h2>Nothing needs attention</h2><p>Every blank and low-confidence field has been confirmed or filled in.</p></div>';
    }

    html += '</div>';
    $("#canvas-body").innerHTML = html;

    // Keep focus in the edit box when a field is being edited
    if(state.editingField){
      var inp = document.getElementById("draft-edit-input");
      if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    }
  }

  function sortedDueRenewal(){
    var list = DUE_RENEWAL.filter(function(r){ return state.dueRenewalFilter === "all" || r.tier === state.dueRenewalFilter; });
    var tierOrder = {high:0, medium:1, low:2};
    var dir = state.dueRenewalSortDir === "desc" ? -1 : 1;
    list = list.slice().sort(function(a,b){
      var cmp = state.dueRenewalSort === "days" ? (a.days - b.days) : (tierOrder[a.tier] - tierOrder[b.tier]);
      return cmp * dir;
    });
    return list;
  }

  function renderDueRenewal(){
    setCanvasHeader("Due for renewal", "Portfolio view — filter and sort, or launch a renewal directly.", "welcome");
    var filters = [["all","All"],["high","High"],["medium","Medium"],["low","Low"]];
    var filterHtml = '<div class="filter-row">'+filters.map(function(f){
      return '<button type="button" class="filter-chip" data-action="due-filter" data-filter="'+f[0]+'" aria-pressed="'+(state.dueRenewalFilter===f[0])+'">'+f[1]+'</button>';

  var drawerReturnFocus = null;
  function drawerFocusables(){
    return Array.prototype.slice.call(
      $("#drawer").querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')
    ).filter(function(el){ return !el.disabled && el.offsetParent !== null; });
  }
  function openDrawer(title, bodyHtml){
    drawerReturnFocus = document.activeElement;
    $("#drawer-title").innerHTML = title;
    $("#drawer-body").innerHTML = bodyHtml;
    $("#drawer").classList.add("open");
    $("#drawer-backdrop").classList.add("open");
    // Move focus into the dialog (a11y: focus management for a modal).
    var focusables = drawerFocusables();
    (focusables[0] || $("#drawer")).focus();
  }
  function closeDrawer(){
    $("#drawer").classList.remove("open");
    $("#drawer-backdrop").classList.remove("open");
    // Return focus to whatever opened the drawer.
    if(drawerReturnFocus && typeof drawerReturnFocus.focus === "function"){ drawerReturnFocus.focus(); }
    drawerReturnFocus = null;
  }
  function isDrawerOpen(){ return $("#drawer").classList.contains("open"); }
  // Esc to close; Tab wraps focus within the open dialog (focus trap).
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && state.tpPageOpen && !isDrawerOpen()){ closeThirdPartiesPage(); return; }
    if(e.key === "Escape" && state.kycPageOpen && !isDrawerOpen()){ closeKycCasesPage(); return; }
    if(!isDrawerOpen()) return;
    if(e.key === "Escape"){ e.preventDefault(); closeDrawer(); return; }
    if(e.key === "Tab"){
      var f = drawerFocusables();
      if(!f.length) return;
      var first = f[0], last = f[f.length-1];
      if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  });

  /* ============================================================

  document.body.addEventListener("click", function(e){
    var target = e.target.closest("[data-action]");
    if(!target) return;
    var action = target.getAttribute("data-action");

    if(action === "set-persona"){
      var persona = target.getAttribute("data-persona");
      state.persona = persona;
      document.querySelectorAll('[data-action="set-persona"]').forEach(function(b){
        b.setAttribute("aria-pressed", b.getAttribute("data-persona") === persona ? "true" : "false");
      });
      updateIdentityText();
      renderChips();
      renderRoster();
      syncCompliancePane();
      if(state.tpPageOpen){ renderThirdPartiesPage(); }
      toast("Switched persona to " + (persona === "reviewer" ? "R&C reviewer" : "Requester") + ". In production this is resolved automatically at sign-in.");
      goView("welcome");
      return;
    }
    if(action === "set-process"){
      var proc = target.getAttribute("data-process");
      if(proc !== state.process){
        applyProcessSwitch(proc);
        goView("welcome");
        toast("Switched to " + (proc === "kyc" ? "FM&I KYC" : "TPA") + " — chat history, roster, and panel sizes carry over; only the process differs (PRD TPA §8).");
      }
      return;
    }
    if(action === "open-third-parties"){
      openThirdPartiesPage();
      return;
    }
    if(action === "close-third-parties"){
      closeThirdPartiesPage();
      return;
    }
    if(action === "tp-page-tier-filter"){
      state.tpPageFilter.tier = target.getAttribute("data-filter");
      document.querySelectorAll('[data-action="tp-page-tier-filter"]').forEach(function(b){
        b.setAttribute("aria-pressed", b.getAttribute("data-filter") === state.tpPageFilter.tier ? "true" : "false");
      });
      renderTpPageResults();
      return;
    }
    if(action === "tp-page-toggle-row"){
      var toggleRef = target.getAttribute("data-ref");
      if(state.tpPageExpanded[toggleRef]){ delete state.tpPageExpanded[toggleRef]; }
      else { state.tpPageExpanded[toggleRef] = true; }
      renderTpPageResults();
      return;
    }
    if(action === "tp-page-open-record"){
      var tpOpenName = target.getAttribute("data-name");
      closeThirdPartiesPage();
      startFind(tpOpenName);
      return;
    }
    if(action === "open-kyc-cases"){
      openKycCasesPage();
      return;
    }
    if(action === "close-kyc-cases"){
      closeKycCasesPage();
      return;
    }
    if(action === "kyc-page-stage-filter"){
      state.kycPageFilter.stage = target.getAttribute("data-filter");
      document.querySelectorAll('[data-action="kyc-page-stage-filter"]').forEach(function(b){
        b.setAttribute("aria-pressed", b.getAttribute("data-filter") === state.kycPageFilter.stage ? "true" : "false");
      });
      renderKycPageResults();
      return;
    }
    if(action === "kyc-page-toggle-row"){
      var kycToggleRef = target.getAttribute("data-ref");
      if(state.kycPageExpanded[kycToggleRef]){ delete state.kycPageExpanded[kycToggleRef]; }
      else { state.kycPageExpanded[kycToggleRef] = true; }
      renderKycPageResults();
      return;
    }
    if(action === "kyc-page-open-record"){
      var kycOpenName = target.getAttribute("data-name");
      closeKycCasesPage();
      startKycFind(kycOpenName);
      return;
    }
    if(action === "chip-task"){
      var task = target.getAttribute("data-task");
      if(task === "find") startFind();
      else if(task === "onboard") promptOnboardName();
      else if(task === "renew") promptRenewName();
      else if(task === "status") startStatus();
      else if(task === "review-pack"){ goView("review-pack"); addMessage("bot","Here\'s the review pack for the record you opened."); }
      else if(task === "exception-report"){ goView("exception-report"); addMessage("bot","Pre-sign-off checklist — nothing here is a pass/fail verdict."); }
      else if(task === "due-renewal"){ goView("due-renewal"); addMessage("bot","Here\'s your renewal pipeline, sorted by days remaining."); }
      else if(task === "risk-alert") startRiskAlert();
      else if(task === "kyc-find") startKycFind();
      else if(task === "kyc-start") promptStartKycCaseName();
      else if(task === "kyc-status") startKycStatus();
      else if(task === "kyc-review-pack"){ goView("welcome"); renderKycReviewPack(); addMessage("bot","Here\'s the review pack for this case."); }
      else if(task === "kyc-exception-report"){ goView("welcome"); renderKycExceptionReport(); addMessage("bot","Pre-sign-off checklist — nothing here is a pass/fail verdict."); }
      return;
    }
    if(action === "kyc-review-filter"){
      state.kycReviewFilter = target.getAttribute("data-filter");
      renderKycReviewPack();
      return;
    }
    if(action === "bu-confirm"){
      state.buConfirmed = true;
      addMessage("user", "Yes, that\'s correct");
      if(state.pendingFlowAfterBu){ var fn = state.pendingFlowAfterBu; state.pendingFlowAfterBu = null; fn(); }
      return;
    }
    if(action === "bu-deny"){
      addMessage("user", "This isn\'t my BU");
      addMessage("bot", "Thanks for flagging this. I\'ve notified your R&C representative to verify your access. You can continue once this is confirmed.");
      return;
    }
    if(action === "find-continue"){
      var contName = target.getAttribute("data-name") || (state.lastFindMatch && state.lastFindMatch.name);
      addMessage("user", "Continue with this record");
      startRenew(contName);
      return;
    }
    if(action === "roster-open"){
      var roName = target.getAttribute("data-name");
      if(state.process === "kyc"){ startKycFind(roName); } else { startFind(roName); }
      return;
    }
    if(action === "submit-name-prompt"){
      var promptMode = target.getAttribute("data-mode");
      var promptInput = document.getElementById(target.getAttribute("data-input"));
      var promptName = promptInput ? promptInput.value.trim() : "";
      if(!promptName){
        toast("Enter a company name first.");
        if(promptInput) promptInput.focus();
        return;
      }
      addMessage("user", (promptMode === "renew" ? "Renew " : promptMode === "kyc-start" ? "Start KYC for " : "Onboard ") + esc(promptName));
      if(promptMode === "renew"){ startRenew(promptName); }
      else if(promptMode === "kyc-start"){ startKycCase(false, promptName); }
      else { startOnboard(false, promptName); }
      return;
    }
    if(action === "find-new"){
      var findNewName = target.getAttribute("data-name");
      addMessage("user", findNewName ? 'Start new onboarding for "'+findNewName+'"' : "This is a different company — start new onboarding");
      startOnboard(false, findNewName || null);
      return;
    }
    if(action === "kyc-continue-case"){
      addMessage("user", "Continue this case");
      resumeKycCase();
      return;
    }
    if(action === "kyc-start-new"){
      var newKycName = target.getAttribute("data-name");
      addMessage("user", newKycName ? 'Start new KYC case for "'+newKycName+'"' : "Start new KYC case");
      startKycCase(false, newKycName || null);
      return;
    }
    if(action === "kyc-confirm-wave1"){
      addMessage("user", "Confirm Wave 1");
      var ref = KYC_CASE.ref;
      setTimeout(function(){
        addMessage("bot",
          '<p><strong>Wave 1 is staged in RCTP as '+esc(ref)+'.</strong> It\'s not complete — any open mandatory items carry forward as outstanding; confirming this draft doesn\'t require them to be resolved first. CDD Typing is next.</p>'+
          '<div class="inline-actions"><button type="button" class="btn primary" data-action="open-rctp">'+icon("external")+' Open in RCTP</button></div>',
          {handoff:true}
        );
        setTimeout(function(){
          state.kycScreeningGate = "PENDING";
          renderKycScreeningGate();
          addMessage("bot",
            "<p><strong>Waiting on screening resolution.</strong> This case can't move to CDD Typing until name screening on "+esc(KYC_CASE.name)+" and its connected parties clears — that's handled outside this chat. Check back, or I'll let you know once it clears.</p>"
          );
        }, 500);
      }, 400);
      pushRecent({name:KYC_CASE.name, ref:ref, tier:null, status:"Wave 1 staged · CDD Typing next"});
      return;
    }
    if(action === "kyc-clear-screening"){
      addMessage("user", "[Simulated] Screening cleared");
      state.kycScreeningGate = "CLEARED";
      pushRecent({name:KYC_CASE.name, ref:KYC_CASE.ref, tier:null, status:"CDD Typing open"});
      setTimeout(function(){
        ensureCddTypingState();
        renderKycCddTyping();
        addMessage("bot",
          "<p>Screening cleared. <strong>CDD Typing is now open</strong> — 19 questions, grouped below. Most are quick Yes/No; a few are pre-filled with a suggestion based on what's already on file, clearly marked as a suggestion, not an answer.</p>"
        );
      }, 400);
      return;
    }
    if(action === "kyc-open-cdd-typing"){
      ensureCddTypingState();
      renderKycCddTyping();
      return;
    }
    if(action === "cdd-answer"){
      var cddQ = target.getAttribute("data-q");
      var cddVal = target.getAttribute("data-value");
      if(state.cddTyping && state.cddTyping[cddQ]){ state.cddTyping[cddQ].value = cddVal; }
      renderKycCddTyping({silent:true});
      return;
    }
    if(action === "cdd-toggle-risk"){
      state.cddRiskExpanded = !state.cddRiskExpanded;
      renderKycCddTyping({silent:true});
      return;
    }
    if(action === "cdd-submit"){
      var unanswered = CDD_TYPING_QUESTIONS.filter(function(q){ return !state.cddTyping[q.q].value; });
      if(unanswered.length){
        toast(unanswered.length+" question"+(unanswered.length>1?"s":"")+" still need"+(unanswered.length>1?"":"s")+" an answer — Q"+unanswered.map(function(q){return q.q;}).join(", Q")+".");
        if(!state.cddRiskExpanded && unanswered.some(function(q){ return q.group === "risk"; })){
          state.cddRiskExpanded = true;
          renderKycCddTyping({silent:true});
        }
        return;
      }
      addMessage("user", "Submit CDD Typing");
      var result = resolveCddTier();
      state.resolvedCddTier = result.tier;
      var wave2Count = WAVE2_STANDARD_ITEMS.length + (result.tier === "Enhanced" ? WAVE2_ENHANCED_ONLY_ITEMS.length : 0);
      var explain = result.tier === "Simplified"
        ? "Resolved tier: Simplified. At least one of Q1–4 resolved Yes."
        : result.tier === "Enhanced"
          ? "Resolved tier: Enhanced. Q"+result.trigger.q+" was the trigger — “"+esc(result.trigger.label)+"”. This unlocks Wave 2 ("+wave2Count+" items) and skips straight past Simplified, regardless of any other answer."
          : "Resolved tier: Standard. No Q1–4 answer qualifies for Simplified, and no Q5–19 answer triggers Enhanced. Wave 2 ("+wave2Count+" items) is next.";
      setTimeout(function(){
        addMessage("bot", "<p><strong>"+explain+"</strong></p>");
        setTimeout(function(){
          var tierFollowup = result.tier === "Simplified" ? "No Wave 2 applies — this case moves straight to review." : "Wave 2 is next.";
          addMessage("bot",
            "<p>CDD Typing is staged in RCTP as <strong>"+esc(KYC_CASE.ref)+"</strong>. Resolved tier: <strong>"+esc(result.tier)+"</strong>. It has not been submitted. "+tierFollowup+"</p>"+
            '<div class="inline-actions"><button type="button" class="btn primary" data-action="open-rctp">'+icon("external")+' Open in RCTP</button></div>',
            {handoff:true}
          );
          if(result.tier === "Simplified"){
            state.kycCaseComplete = true;
            state.inProgressKyc = null;
          } else {
            setTimeout(function(){ renderKycWave2Draft(); }, 500);
          }
        }, 500);
      }, 400);
      pushRecent({name:KYC_CASE.name, ref:KYC_CASE.ref, tier:null, status:"CDD Typing complete · "+result.tier+(result.tier==="Simplified"?" · ready for review":" · Wave 2 next")});
      renderKycCddTyping();
      return;
    }
    if(action === "kyc-confirm-wave2"){
      addMessage("user", "Confirm Wave 2");
      var w2items = state.kycWave2Defs.map(function(def){ return state.kycWave2[def.item]; });
      var w2open = w2items.filter(function(it){ return it.status !== "present"; });
      var w2openList = w2open.map(function(it){ return it.item; }).join(", ");
      setTimeout(function(){
        addMessage("bot",
          '<p><strong>Wave 2 is staged.</strong> '+(w2open.length ? esc(w2openList)+" "+(w2open.length>1?"are":"is")+" still open. " : "")+
          'This case is now at <strong>Case Complete'+(w2open.length?"-with-open-items":"")+'</strong> — everything that will ever be requested has been asked for; what\'s outstanding needs the customer, not another wave.</p>'+
          '<div class="inline-actions"><button type="button" class="btn primary" data-action="open-rctp">'+icon("external")+' Open in RCTP</button></div>',
          {handoff:true}
        );
      }, 400);
      state.kycCaseComplete = true;
      state.inProgressKyc = null;
      pushRecent({name:KYC_CASE.name, ref:KYC_CASE.ref, tier:null, status:"Case complete"+(w2open.length?" · open items":"")+" · ready for review"});
      return;
    }
    if(action === "kyc-item-confirm" || action === "kyc-item-unconfirm"){
      var kciWave = target.getAttribute("data-wave") || "1";
      var kciStore = kciWave === "2" ? state.kycWave2 : state.kycWave1;
      var kciId = target.getAttribute("data-item");
      var kciRec = kciStore && kciStore[kciId];
      if(!kciRec) return;
      kciRec.confirmed = (action === "kyc-item-confirm");
      kycRerenderWave(kciWave, {silent:true});
      if(kciRec.confirmed){ toast('"'+kciId+' '+kciRec.label+'" confirmed.'); }
      return;
    }
    if(action === "kyc-item-upload" || action === "kyc-item-replace"){
      var kuWave = target.getAttribute("data-wave") || "1";
      var kuStore = kuWave === "2" ? state.kycWave2 : state.kycWave1;
      var kuId = target.getAttribute("data-item");
      var kuRec = kuStore && kuStore[kuId];
      if(!kuRec) return;
      // Simulated upload (prototype has no real file I/O) — same "instant" convention
      // as the Wave 1 dropzone's "Use sample documents" shortcut.
      var wasReplace = kuRec.status === "present" || kuRec.status === "nonctc";
      kuRec.status = "present";
      kuRec.confidence = "high";
      kuRec.source = "p.1, " + kuRec.label + " (" + (wasReplace ? "replacement" : "new") + " upload, just now)";
      kuRec.snippet = "";
      kuRec.note = null;
      kuRec.justRemoved = false;
      kuRec.removedSnapshot = null;
      kycRerenderWave(kuWave, {silent:true});
      toast((wasReplace ? "Replacement uploaded for " : "Uploaded ") + '"'+kuId+' '+kuRec.label+'."');
      return;
    }
    if(action === "kyc-item-remove"){
      var krWave = target.getAttribute("data-wave") || "1";
      var krStore = krWave === "2" ? state.kycWave2 : state.kycWave1;
      var krId = target.getAttribute("data-item");
      var krRec = krStore && krStore[krId];
      if(!krRec) return;
      // Soft delete: snapshot the full record and flip to Missing, but keep an inline,
      // non-expiring Undo (no timed toast) — an accidental click on a destructive action
      // must stay recoverable until the reviewer deliberately dismisses it.
      krRec.removedSnapshot = {
        status:krRec.status, confidence:krRec.confidence, source:krRec.source,
        snippet:krRec.snippet, note:krRec.note, confirmed:krRec.confirmed
      };
      krRec.status = "missing";
      krRec.confidence = null;
      krRec.source = null;
      krRec.snippet = null;
      krRec.confirmed = false;
      krRec.justRemoved = true;
      kycRerenderWave(krWave, {silent:true});
      return;
    }
    if(action === "kyc-item-undo-remove"){
      var kuiWave = target.getAttribute("data-wave") || "1";
      var kuiStore = kuiWave === "2" ? state.kycWave2 : state.kycWave1;
      var kuiId = target.getAttribute("data-item");
      var kuiRec = kuiStore && kuiStore[kuiId];
      if(!kuiRec || !kuiRec.removedSnapshot) return;
      var snap = kuiRec.removedSnapshot;
      kuiRec.status = snap.status; kuiRec.confidence = snap.confidence; kuiRec.source = snap.source;
      kuiRec.snippet = snap.snippet; kuiRec.note = snap.note; kuiRec.confirmed = snap.confirmed;
      kuiRec.justRemoved = false; kuiRec.removedSnapshot = null;
      kycRerenderWave(kuiWave, {silent:true});
      toast('Restored "'+kuiId+' '+kuiRec.label+'."');
      return;
    }
    if(action === "use-sample-docs"){
      var wid = target.getAttribute("data-widget");
      var mode = target.getAttribute("data-mode");
      var sampleFiles = mode === "kyc-wave1"
        ? ["Certificate_of_Incorporation.pdf", "ACRA_Bizfile_Extract.pdf", "Constitution_Excerpt.pdf", "Register_of_Directors.pdf", "Board_Resolution_Appointment.pdf", "Specimen_Signature.pdf", "Government_ID_Self_Certified.pdf"]
        : ["Signed_Contract.pdf", "ACRA_Bizfile.pdf", "Register_Directors_Shareholders.pdf", "Completed_DDQ.docx"];
      addFilesToWidget(wid, mode, sampleFiles);
      return;
    }
    if(action === "continue-upload"){
      var mode2 = target.getAttribute("data-mode");
      if(mode2 === "kyc-wave1"){ renderKycProcessing(mode2); } else { renderProcessing(mode2); }
      return;
    }
    if(action === "open-citation"){
      openCitation(target.getAttribute("data-source"), target.getAttribute("data-snippet"));
      return;
    }
    if(action === "open-drawer" && target.getAttribute("data-drawer") === "role-info"){
      openRoleInfo();
      return;
    }
    if(action === "close-drawer"){ closeDrawer(); return; }
    if(action === "open-adverse-media"){
      openAdverseMedia(target.getAttribute("data-entity"), target.getAttribute("data-detail"));
      return;
    }
    if(action === "remediate"){
      var entityName = target.getAttribute("data-entity");
      var verdict = target.getAttribute("data-verdict");
      state.remediation[entityName] = verdict;
      refreshComplianceScreening();
      toast('Recorded "'+verdict+'" for '+entityName+' — synced to RCTP as a recommendation. Final clearance is confirmed there.');
      return;
    }
    if(action === "download-report"){
      var includeAdverse = document.getElementById("include-adverse-toggle");
      var withAdverse = includeAdverse ? includeAdverse.checked : true;
      toast("Generating compliance report (PDF) — screening summary, sanctions lists checked" + (withAdverse ? ", and adverse media summary" : "") + ". This would download in production.");
      return;
    }
    if(action === "open-rctp"){
      toast("This would open Dow Jones RCTP in a new tab — the client never marks this task as complete on its own.");
      return;
    }
    if(action === "go-view"){
      goView(target.getAttribute("data-view"));
      return;
    }
    if(action === "go-home"){
      closeThirdPartiesPage();
      closeKycCasesPage();
      goView("welcome");
      return;
    }
    if(action === "draft-filter"){
      state.draftFilter = target.getAttribute("data-filter");
      renderDraftBody();
      return;
    }
    if(action === "due-filter"){
      state.dueRenewalFilter = target.getAttribute("data-filter");
      renderDueRenewal();
      return;
    }
    if(action === "due-sort"){
      var sortCol = target.getAttribute("data-sort");
      if(state.dueRenewalSort === sortCol){
        state.dueRenewalSortDir = state.dueRenewalSortDir === "desc" ? "asc" : "desc";
      } else {
        state.dueRenewalSort = sortCol;
        state.dueRenewalSortDir = "asc";
      }
      renderDueRenewal();
      return;
    }
    if(action === "start-renewal"){
      startRenew(target.getAttribute("data-name"));
      return;
    }
    if(action === "ack-alert"){
      toast("Acknowledged. No automated action was taken.");
      return;
    }
    if(action === "toggle-proto-nav"){
      $("#proto-nav").classList.toggle("collapsed");
      return;
    }
    if(action === "proto-jump"){
      protoJump(target.getAttribute("data-target"));
      return;
    }
    if(action === "demo-failure"){
      var stateId = target.getAttribute("data-target");
      var demo = FAILURE_DEMOS.filter(function(f){ return f.id === stateId; })[0];
      if(!demo) return;
      addMessage("bot", "<p>"+icon("warn")+" "+demo.msg+"</p>", {alert:true});
      // These two states are session-wide: the client actually drops to read-only (§7.10).
      if(stateId === "identity-unverifiable" || stateId === "entitlements-stale"){
        setReadOnly(true, demo.msg);
      }
      return;
    }
    if(action === "field-edit"){
      state.editingField = target.getAttribute("data-field");
      renderDraftBody();
      return;
    }
    if(action === "field-cancel"){
      state.editingField = null;
      renderDraftBody();
      return;
    }
    if(action === "field-save"){
      saveEditField();
      return;
    }
    if(action === "field-confirm"){
      var cf = target.getAttribute("data-field");
      if(state.draftFields[cf]){ state.draftFields[cf].confirmed = true; }
      logEvent("field_confirmed", {field:cf});
      renderDraftBody();
      toast('“'+cf+'” confirmed.');
      return;
    }
    if(action === "resume-draft"){
      var ip = state.process === "kyc" ? state.inProgressKyc : state.inProgressTpa;
      if(!ip) return;
      pushRecent({name:ip.name, ref:ip.ref, tier: ip.mode.indexOf("kyc") === 0 ? null : COMPANY.riskTier, status:ip.label});
      if(ip.mode === "renew"){ renderRenewDelta({silent:true}); }
      else if(ip.mode === "kyc-wave1"){ renderKycWave1Draft({silent:true}); }
      else if(ip.mode === "kyc-wave2"){ renderKycWave2Draft({silent:true}); }
      else if(ip.mode === "kyc-screening"){ renderKycScreeningGate(); }
      else if(ip.mode === "kyc-cdd-typing"){ renderKycCddTyping({silent:true}); }
      else { renderOnboardDraft({silent:true}); }
      return;
    }
    if(action === "exit-readonly"){
      setReadOnly(false);
      toast("Sign-in re-verified — writes re-enabled. (In production this resolves when the server can forward a verified identity again.)");
      return;
    }
    if(action === "composer-attach"){
      if(state.process === "kyc"){ promptStartKycCaseName(); } else { promptOnboardName(); }
      return;
    }
    if(action === "composer-send"){
      sendComposerText();
      return;
    }
  });

  document.body.addEventListener("change", function(e){
    if(e.target && e.target.matches('input[type="file"]')){
      var input = e.target;
      var wid = input.id.replace("file-", "");
      var mode = (document.getElementById(wid) || {}).getAttribute ? document.getElementById(wid).getAttribute("data-mode") : "onboard";
      var names = Array.prototype.map.call(input.files, function(f){ return f.name; });

  document.body.addEventListener("dragover", function(e){
    var dz = e.target.closest(".dropzone");
    if(dz){ e.preventDefault(); dz.classList.add("dragover"); }
  });
  document.body.addEventListener("dragleave", function(e){
    var dz = e.target.closest(".dropzone");
    if(dz){ dz.classList.remove("dragover"); }
  });
  document.body.addEventListener("drop", function(e){
    var dz = e.target.closest(".dropzone");
    if(!dz) return;
    e.preventDefault();
    dz.classList.remove("dragover");
    var mode = dz.getAttribute("data-mode");
    var names = Array.prototype.map.call(e.dataTransfer.files, function(f){ return f.name; });
    if(names.length){ addFilesToWidget(dz.id, mode, names); }
    else { addFilesToWidget(dz.id, mode, ["Dropped_Document.pdf"]); }
  });

  // Pull the company name out of a typed instruction ("Onboard Acme Marine Pte Ltd" ->
  // "Acme Marine Pte Ltd") rather than discarding it and falling back to the Acme demo record.
  function extractNameAfterKeyword(text, keyword){
    var lower = text.toLowerCase();
    var idx = lower.indexOf(keyword);
    if(idx === -1) return null;
    var rest = text.slice(idx + keyword.length).trim();
    rest = rest.replace(/^(a|the|new|for|third party|company)\s+/i, "").trim();
    return rest || null;
  }

  function sendComposerText(){
    var input = $("#composer-input");
    var text = input.value.trim();
    if(!text) return;
    addMessage("user", esc(text));
    input.value = "";
    var lower = text.toLowerCase();
    setTimeout(function(){
      if(state.process === "kyc"){
        if(lower.indexOf("start") !== -1){
          var kycStartName = extractNameAfterKeyword(text, "start");
          if(kycStartName){ startKycCase(false, kycStartName); } else { promptStartKycCaseName(); }
        } else {
          startKycFind(text, {skipUserMsg:true});
        }
        return;
      }
      if(lower.indexOf("renew") !== -1){
        var renewName = extractNameAfterKeyword(text, "renew");
        if(renewName){ startRenew(renewName); } else { promptRenewName(); }
      }
      else if(lower.indexOf("status") !== -1 || lower.indexOf("where") !== -1){ startStatus(); }
      else if(lower.indexOf("onboard") !== -1){
        var onboardName = extractNameAfterKeyword(text, "onboard");
        if(onboardName){ startOnboard(false, onboardName); } else { promptOnboardName(); }
      }
      else { startFind(text, {skipUserMsg:true}); }
    }, 250);
  }

  $("#composer-input").addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); sendComposerText(); }
  });

  /* ============================================================
     RESIZABLE PANELS — chat / workspace / compliance screening / roster
     are all user-adjustable in width or height via drag handles between
     them (mouse-drag, or arrow keys when a handle has focus). Sizes are
     applied as CSS custom properties on :root and persisted so the
     layout survives a reload.
     ============================================================ */
  function initResizers(){
    var main = $(".main");
    var chatPane = $(".chat-pane");
    var canvasPane = $(".canvas-pane");
    var rosterPane = $(".roster-pane");
    var canvasTop = $(".canvas-top");
    if(!main || !chatPane || !canvasPane || !rosterPane || !canvasTop) return;

    var MIN_CHAT = 280, MIN_CANVAS = 320, MIN_ROSTER = 180, MIN_SPLIT = 120;
    var STORAGE_KEY = "tpaLayoutSizes";

    function setVar(name, val){ document.documentElement.style.setProperty(name, val); }

    function persist(){
      try{
        var cs = getComputedStyle(document.documentElement);
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          chatW: cs.getPropertyValue("--chat-w").trim(),
          rosterW: cs.getPropertyValue("--roster-w").trim(),
          topH: cs.getPropertyValue("--canvas-top-h").trim()
        }));
      } catch(e){}
    }
    (function restore(){
      try{
        var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if(saved){
          if(saved.chatW) setVar("--chat-w", saved.chatW);
          if(saved.rosterW) setVar("--roster-w", saved.rosterW);
          if(saved.topH) setVar("--canvas-top-h", saved.topH);
        }
      } catch(e){}
    })();

    function beginDrag(handle, onMove){
      handle.classList.add("dragging");
      document.body.style.userSelect = "none";
      function onUp(){
        handle.classList.remove("dragging");
        document.body.style.userSelect = "";
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        persist();
      }
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    }

    function colHandler(which){
      return function(startEvent){
        startEvent.preventDefault();
        var handle = startEvent.currentTarget;
        var mainRect = main.getBoundingClientRect();
        var startX = startEvent.clientX;
        var chatW = chatPane.getBoundingClientRect().width;
        var rosterW = rosterPane.getBoundingClientRect().width;
        function onMove(e){
          var dx = e.clientX - startX;
          if(which === "chat-canvas"){
            var maxChat = mainRect.width - rosterW - MIN_CANVAS - 12;
            setVar("--chat-w", Math.max(MIN_CHAT, Math.min(chatW + dx, maxChat)) + "px");
          } else {
            var maxRoster = mainRect.width - chatW - MIN_CANVAS - 12;
            setVar("--roster-w", Math.max(MIN_ROSTER, Math.min(rosterW - dx, maxRoster)) + "px");
          }
        }
        beginDrag(handle, onMove);
      };
    }

    function rowHandler(){
      return function(startEvent){
        startEvent.preventDefault();
        var handle = startEvent.currentTarget;
        var containerRect = canvasPane.getBoundingClientRect();
        var startY = startEvent.clientY;
        var topH = canvasTop.getBoundingClientRect().height;
        function onMove(e){
          var dy = e.clientY - startY;
          var maxTop = containerRect.height - MIN_SPLIT - 6;
          setVar("--canvas-top-h", Math.max(MIN_SPLIT, Math.min(topH + dy, maxTop)) + "px");
        }
        beginDrag(handle, onMove);
      };
    }

    document.querySelectorAll('[data-resize="chat-canvas"]').forEach(function(el){
      el.addEventListener("mousedown", colHandler("chat-canvas"));
    });
    document.querySelectorAll('[data-resize="canvas-roster"]').forEach(function(el){
      el.addEventListener("mousedown", colHandler("canvas-roster"));
    });
    document.querySelectorAll('[data-resize="canvas-top-bottom"]').forEach(function(el){
      el.addEventListener("mousedown", rowHandler());
    });

    // Keyboard support: focus a handle (Tab) then use arrow keys to nudge it.
    document.querySelectorAll(".resizer").forEach(function(el){
      el.addEventListener("keydown", function(e){
        var step = 24;
        var isCol = el.classList.contains("resizer-v");
        if(isCol && (e.key === "ArrowLeft" || e.key === "ArrowRight")){
          e.preventDefault();
          var delta = (e.key === "ArrowRight" ? 1 : -1) * step;
          if(el.getAttribute("data-resize") === "chat-canvas"){
            setVar("--chat-w", Math.max(MIN_CHAT, chatPane.getBoundingClientRect().width + delta) + "px");
          } else {
            setVar("--roster-w", Math.max(MIN_ROSTER, rosterPane.getBoundingClientRect().width - delta) + "px");
          }
          persist();
        } else if(!isCol && (e.key === "ArrowUp" || e.key === "ArrowDown")){
          e.preventDefault();
          var deltaY = (e.key === "ArrowDown" ? 1 : -1) * step;
          setVar("--canvas-top-h", Math.max(MIN_SPLIT, canvasTop.getBoundingClientRect().height + deltaY) + "px");
          persist();
        }
      });
    });
  }

  /* ============================================================
     INIT
     ============================================================ */
  function init(){
    updateBrandForProcess();
    updateIdentityText();
    renderChips();
    renderProtoNav();
    renderRoster();
    initResizers();
    goView("welcome");
    addMessage("bot",
      '<p>Hi Da\'yl — I can help you find, onboard, renew, or check the status of a third party.</p>'+
      '<p>Pick a quick action below, or just tell me a company name.</p>'
    );
  }
  init();
})();
</script>
