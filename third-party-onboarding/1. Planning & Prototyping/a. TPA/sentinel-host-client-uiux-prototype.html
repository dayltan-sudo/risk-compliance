<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>KAI Sentinel — TPA · Host Client UI/UX Prototype</title>
<style>
  :root{
    --color-bg:#EDF1F0;
    --color-surface:#FFFFFF;
    --color-surface-alt:#E6ECE9;
    --color-border:#C7D2CD;
    --color-fg:#16233B;
    --color-muted:#5C6B72;
    --color-primary:#0E6E64;
    --color-primary-strong:#0A5850;
    --color-primary-fg:#ffffff;
    --color-accent:#A8721E;
    --color-warning-bg:#FBF0DD;
    --color-warning-border:#A8721E;
    --color-warning-fg:#6B4A12;
    --color-danger-bg:#F7E4E1;
    --color-danger-border:#A93226;
    --color-danger-fg:#7A241B;
    --color-success-bg:#E1F0EC;
    --color-success-border:#0E6E64;
    --color-success-fg:#0A5850;
    --color-info-bg:#E7F0EF;
    --color-info-border:#0E6E64;
    --masthead-bg:#101B2C;
    --masthead-fg:#EFF3F1;
    --radius-sm:6px;
    --radius-md:10px;
    --radius-lg:16px;
    --shadow-sm:0 1px 2px rgba(15,23,42,.08);
    --shadow-md:0 6px 20px rgba(15,23,42,.14);
    --font-sans:"Calibri","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    --font-display:Cambria,Georgia,"Iowan Old Style","Times New Roman",serif;
    --font-mono:Consolas,"SF Mono","Cascadia Code","Courier New",monospace;
    color-scheme:light dark;
    /* User-adjustable panel sizes (§ resizable layout) — dragged via .resizer handles,
       persisted in localStorage so the layout survives a reload. */
    --chat-w:34%;
    --roster-w:20%;
    --canvas-top-h:60%;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --color-bg:#0E1512;
      --color-surface:#16201C;
      --color-surface-alt:#1B2622;
      --color-border:#33413C;
      --color-fg:#E7ECE9;
      --color-muted:#93A29B;
      --color-primary:#3FB3A4;
      --color-primary-strong:#63C7BA;
      --color-primary-fg:#0E1512;
      --color-accent:#D9A857;
      --color-warning-bg:#3A2C12;
      --color-warning-border:#D9A857;
      --color-warning-fg:#F2CE8F;
      --color-danger-bg:#3A1714;
      --color-danger-border:#E0685A;
      --color-danger-fg:#F3A99C;
      --color-success-bg:#123028;
      --color-success-border:#3FB3A4;
      --color-success-fg:#8FDCCF;
      --color-info-bg:#122824;
      --color-info-border:#3FB3A4;
      --masthead-bg:#0A1310;
      --masthead-fg:#E7ECE9;
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--font-sans);
    background:var(--color-bg);
    color:var(--color-fg);
    font-size:14px;
    line-height:1.45;
  }
  button{font-family:inherit;font-size:inherit;}
  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }
  :focus-visible{outline:2px solid var(--color-primary);outline-offset:2px;}

  /* ---------- App shell ---------- */
  .app{
    height:100vh;
    display:grid;
    grid-template-rows:auto 1fr;
  }
  .topbar{
    display:flex;
    align-items:center;
    gap:16px;
    padding:10px 20px;
    background:var(--masthead-bg);
    border-block-end:1px solid rgba(255,255,255,.08);
    box-shadow:var(--shadow-md);
    z-index:5;
  }
  .brand{
    display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap;
    font-family:var(--font-display);color:var(--masthead-fg);letter-spacing:.01em;
    background:none;border:none;padding:4px 2px;margin:-4px -2px;border-radius:var(--radius-sm);cursor:pointer;
  }
  .brand:hover{background:rgba(239,243,241,.1);}
  .brand-mark{
    width:28px;height:28px;border-radius:3px;background:linear-gradient(135deg,var(--color-primary),var(--color-accent));
    display:flex;align-items:center;justify-content:center;color:#fff;flex:none;
  }
  .brand-sub{font-weight:400;font-family:var(--font-sans);color:rgba(239,243,241,.55);font-size:12px;}
  .topbar-nav-btn{
    display:flex;align-items:center;gap:7px;
    background:rgba(239,243,241,.08);border:1px solid rgba(239,243,241,.16);border-radius:999px;
    padding:7px 14px;color:var(--masthead-fg);font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap;
  }
  .topbar-nav-btn:hover{background:rgba(239,243,241,.16);}
  .topbar-nav-btn[aria-pressed="true"]{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-primary-fg);}
  .topbar-spacer{flex:1;}
  .identity-chip{
    display:flex;align-items:center;gap:8px;
    background:rgba(239,243,241,.08);
    border:1px solid rgba(239,243,241,.16);
    border-radius:999px;
    padding:5px 12px 5px 6px;
    font-size:12.5px;
    color:var(--masthead-fg);
  }
  .identity-avatar{
    width:22px;height:22px;border-radius:50%;background:var(--color-primary);color:var(--color-primary-fg);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;
  }
  .identity-chip .info-btn{
    background:none;border:none;color:rgba(239,243,241,.6);cursor:pointer;display:flex;padding:2px;border-radius:50%;
  }
  .identity-chip .info-btn:hover{color:var(--masthead-fg);background:rgba(239,243,241,.12);}
  .persona-switch{
    display:flex;align-items:center;gap:8px;
  }
  .persona-switch-label{font-size:11px;color:rgba(239,243,241,.55);white-space:nowrap;}
  .segmented{
    display:flex;background:rgba(239,243,241,.08);border:1px solid rgba(239,243,241,.16);border-radius:999px;padding:2px;
  }
  .segmented button{
    border:none;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;color:rgba(239,243,241,.65);font-weight:600;font-size:12.5px;
  }
  .segmented button[aria-pressed="true"]{background:var(--color-primary);color:var(--color-primary-fg);}

  .main{
    display:grid;
    grid-template-columns:var(--chat-w) 6px 1fr 6px var(--roster-w);
    min-height:0;
  }
  .chat-pane,.canvas-pane,.roster-pane{min-height:0;min-width:0;display:flex;flex-direction:column;}
  .chat-pane{
    border-inline-end:1px solid var(--color-border);
    background:var(--color-surface);
  }
  .canvas-pane{background:var(--color-bg);}

  /* ---------- Resize handles (panels are user-adjustable in width/height) ---------- */
  .resizer{background:var(--color-border);flex:none;position:relative;}
  .resizer::after{content:"";position:absolute;background:transparent;}
  .resizer-v{width:6px;cursor:col-resize;}
  .resizer-v::after{inset-block:0;inset-inline:-4px;}
  .resizer-h{height:6px;cursor:row-resize;}
  .resizer-h::after{inset-inline:0;inset-block:-4px;}
  .resizer:hover,.resizer.dragging{background:var(--color-primary);}
  .resizer:focus-visible{outline:2px solid var(--color-primary);outline-offset:-2px;}

  /* ---------- Third parties page (full-page, topbar-accessible) ---------- */
  .tp-page{display:none;flex-direction:column;min-height:0;background:var(--color-bg);}
  .app.tp-active .main{display:none;}
  .app.tp-active .tp-page{display:flex;}
  /* KYC Cases reuses the .tp-page structural rules above (they're generic layout, not
     TPA-specific) but gates on its own class — .tp-active and .kyc-page-active are never
     set at the same time, so only one full-page view shows. */
  .app.kyc-page-active .main{display:none;}
  .app.kyc-page-active .kyc-page{display:flex;}
  .tp-page-header{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 24px;border-block-end:1px solid var(--color-border);background:var(--color-surface);
  }
  .tp-page-header h1{margin:0;font-size:18px;font-family:var(--font-display);font-weight:700;color:var(--color-fg);}
  .tp-page-header .sub{color:var(--color-muted);font-size:12px;margin-top:2px;}
  .tp-page-body{flex:1;overflow-y:auto;padding:22px 24px;}
  .tp-page-toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:14px;}
  .tp-page-search{max-width:280px;}
  table.data-table tr.tp-row-expanded td{border-block-end-color:transparent;}
  table.data-table tr.tp-expand-row td{background:var(--color-surface-alt);padding:0;border-block-end:1px solid var(--color-border);}
  table.data-table tr.tp-expand-row:hover{background:transparent;}
  .tp-expand-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;padding:16px 20px;}
  @media (max-width:720px){ .tp-expand-grid{grid-template-columns:1fr;} }
  .tp-expand-heading{font-weight:700;font-size:12px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .tp-expand-field{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:5px 0;border-block-end:1px solid var(--color-border);font-size:12px;}
  .tp-expand-field:last-child{border-block-end:none;}
  .tp-expand-field-label{color:var(--color-muted);}
  .tp-expand-field-value{font-weight:600;text-align:end;}
  .tp-expand-empty{display:flex;gap:12px;align-items:center;padding:20px;color:var(--color-muted);font-size:12.5px;}
  .tp-expand-empty svg{flex:none;}
  .tp-expand-empty-sub{margin-top:2px;}
  .tp-expand-actions{padding:4px 20px 18px;}

  /* ---------- Roster pane (third parties in view) ---------- */
  .roster-pane{
    border-inline-start:1px solid var(--color-border);
    background:var(--color-surface);
  }
  .roster-header{padding:14px 16px;border-block-end:1px solid var(--color-border);}
  .roster-header h1{font-size:14px;margin:0;font-weight:700;font-family:var(--font-display);color:var(--color-fg);}
  .roster-header .sub{color:var(--color-muted);font-size:11px;margin-top:2px;}
  .roster-body{flex:1;overflow-y:auto;padding:14px 16px;}
  .roster-section{margin-bottom:18px;}
  .roster-section:last-child{margin-bottom:0;}
  .roster-section-title{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--color-muted);font-weight:700;
    margin:0 0 8px;padding-block-end:6px;border-block-end:1px solid var(--color-border);font-family:var(--font-mono);
  }
  .roster-empty{color:var(--color-muted);font-size:11.5px;padding:2px 2px 4px;}
  .roster-item{
    display:block;width:100%;text-align:start;border:1px solid var(--color-border);border-radius:var(--radius-md);
    padding:9px 11px;margin-bottom:8px;background:var(--color-surface);cursor:pointer;color:var(--color-fg);font-family:inherit;
  }
  .roster-item:last-child{margin-bottom:0;}
  .roster-item:hover{border-color:var(--color-primary);}
  .roster-item .ri-name{font-weight:700;font-size:12px;font-family:var(--font-display);line-height:1.3;}
  .roster-item .ri-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:5px;}
  .roster-item .ri-ref{color:var(--color-muted);font-size:10.5px;font-family:var(--font-mono);}
  .roster-item .ri-status{color:var(--color-muted);font-size:11px;margin-top:4px;}
  .canvas-top{flex:0 0 var(--canvas-top-h);display:flex;flex-direction:column;min-height:0;border-block-end:3px solid var(--color-border);}
  .canvas-bottom{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;}
  .canvas-bottom.hidden{display:none;}
  .canvas-top.full{flex:1 1 auto;border-block-end:none;}
  .canvas-bottom .canvas-header{background:var(--color-surface-alt);}

  /* ---------- Chat pane ---------- */
  .chat-log{
    flex:1;overflow-y:auto;padding:18px 18px 8px;display:flex;flex-direction:column;gap:12px;
  }
  .msg{max-width:92%;display:flex;flex-direction:column;gap:6px;}
  .msg.bot{align-self:flex-start;}
  .msg.user{align-self:flex-end;align-items:flex-end;}
  .msg.system{align-self:center;max-width:98%;width:100%;}
  .bubble{
    padding:10px 13px;border-radius:var(--radius-md);font-size:13.5px;
  }
  .msg.bot .bubble{background:var(--color-surface-alt);border:1px solid var(--color-border);border-start-start-radius:2px;}
  .msg.user .bubble{background:var(--color-primary);color:var(--color-primary-fg);border-start-end-radius:2px;}
  .msg.system .bubble{
    background:var(--color-info-bg);border:1px dashed var(--color-info-border);width:100%;
  }
  .msg .meta{font-size:10.5px;color:var(--color-muted);padding:0 3px;}
  .bubble p{margin:0 0 6px;}
  .bubble p:last-child{margin-bottom:0;}
  .bubble strong{font-weight:700;}
  .handoff-bubble{border-inline-start:3px solid var(--color-primary) !important;}
  .alert-bubble{border-inline-start:3px solid var(--color-danger-border) !important;background:var(--color-danger-bg) !important;}

  .inline-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:7px 13px;border-radius:var(--radius-sm);border:1px solid var(--color-border);
    background:var(--color-surface);color:var(--color-fg);cursor:pointer;font-weight:600;font-size:12.5px;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--color-primary);color:var(--color-primary);}
  .btn.primary{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-primary-fg);}
  .btn.primary:hover{background:var(--color-primary-strong);color:var(--color-primary-fg);}
  .btn.subtle{background:transparent;border-color:transparent;color:var(--color-muted);padding:6px 8px;}
  .btn.subtle:hover{color:var(--color-primary);background:var(--color-surface-alt);}
  .btn.danger-outline{color:var(--color-danger-fg);border-color:var(--color-danger-border);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn svg{flex:none;}

  .record-card{
    border:1px solid var(--color-border);border-radius:var(--radius-md);padding:10px 12px;background:var(--color-surface);margin-top:6px;
  }
  .record-card .rc-name{font-weight:700;font-size:14px;font-family:var(--font-display);}
  .record-card .rc-meta{color:var(--color-muted);font-size:12px;margin-top:2px;font-family:var(--font-mono);}

  .chat-composer{border-block-start:1px solid var(--color-border);padding:12px 16px 14px;background:var(--color-surface);}
  .chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;}
  .chip{
    border:1px solid var(--color-border);background:var(--color-surface-alt);border-radius:999px;
    padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--color-fg);
  }
  .chip:hover{border-color:var(--color-primary);color:var(--color-primary);}
  .chip[data-tone="reviewer"]{background:var(--color-info-bg);}
  .chip:disabled{opacity:.55;cursor:not-allowed;}
  .composer-row{display:flex;gap:8px;align-items:center;}
  .composer-input{
    flex:1;border:1px solid var(--color-border);border-radius:999px;padding:9px 15px;background:var(--color-surface-alt);color:var(--color-fg);
  }
  .composer-input:focus{outline:2px solid var(--color-primary);outline-offset:1px;}
  .icon-btn{
    border:1px solid var(--color-border);background:var(--color-surface-alt);border-radius:50%;width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--color-muted);flex:none;
  }
  .icon-btn:hover{color:var(--color-primary);border-color:var(--color-primary);}

  /* dropzone */
  .dropzone{
    border:1.5px dashed var(--color-border);border-radius:var(--radius-md);padding:16px;text-align:center;
    background:var(--color-surface);margin-top:8px;
  }
  .dropzone.dragover{border-color:var(--color-primary);background:var(--color-info-bg);}
  .dropzone p{margin:6px 0;color:var(--color-muted);font-size:12.5px;}
  .file-chip-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;text-align:start;}
  .file-chip{
    display:flex;align-items:center;gap:8px;border:1px solid var(--color-border);border-radius:var(--radius-sm);
    padding:6px 10px;background:var(--color-surface-alt);font-size:12px;
  }
  .file-chip .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .file-progress{height:4px;flex:none;width:60px;background:var(--color-border);border-radius:2px;overflow:hidden;}
  .file-progress > span{display:block;height:100%;background:var(--color-primary);width:0%;transition:width .5s ease;}
  .file-chip.done .file-progress > span{background:var(--color-success-border);}

  /* ---------- Canvas pane ---------- */
  .canvas-header{
    display:flex;align-items:center;gap:10px;padding:14px 22px;border-block-end:1px solid var(--color-border);background:var(--color-surface);
  }
  .canvas-header h1{font-size:16px;margin:0;font-weight:700;font-family:var(--font-display);color:var(--color-fg);}
  .canvas-header .sub{color:var(--color-muted);font-size:12px;}
  .canvas-body{flex:1;overflow-y:auto;padding:22px;}
  .panel{
    background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);
    padding:18px 20px;box-shadow:var(--shadow-sm);margin-bottom:16px;
  }
  .panel h2{margin:0 0 4px;font-size:15px;font-family:var(--font-display);font-weight:700;padding-block-end:8px;border-block-end:1px solid var(--color-border);}
  .panel .panel-sub{color:var(--color-muted);font-size:12px;margin-bottom:12px;margin-top:8px;}
  .empty-state{
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:60px 20px;color:var(--color-muted);
  }
  .empty-state svg{margin-bottom:14px;opacity:.6;}
  .empty-state h2{color:var(--color-fg);font-size:16px;margin:0 0 6px;font-family:var(--font-display);}
  .tips-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:22px;width:100%;max-width:640px;}
  .tip-card{border:1px solid var(--color-border);border-radius:var(--radius-md);padding:12px;text-align:start;background:var(--color-surface);}
  .tip-card strong{display:block;font-size:12.5px;margin-bottom:3px;}
  .tip-card span{color:var(--color-muted);font-size:11.5px;}
  .mono{font-family:var(--font-mono);}

  /* Ink-stamp verdict marks: every status in this product is a stamped verdict
     (clear / review / hit), so the badge takes on that shape rather than a generic pill. */
  .badge{
    display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:2px;
    font-size:10.5px;font-weight:700;border:1.5px solid transparent;
    font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em;
    transform:rotate(-1.5deg);animation:stamp-down .16s ease-out;
  }
  @keyframes stamp-down{from{transform:rotate(-1.5deg) scale(1.35);opacity:0;}to{transform:rotate(-1.5deg) scale(1);opacity:1;}}
  @media (prefers-reduced-motion: reduce){ .badge{animation:none;} }
  .badge.confidence-high{background:var(--color-success-bg);color:var(--color-success-fg);border-color:var(--color-success-border);}
  .badge.confidence-medium{background:var(--color-warning-bg);color:var(--color-warning-fg);border-color:var(--color-warning-border);}
  .badge.confidence-low{background:var(--color-danger-bg);color:var(--color-danger-fg);border-color:var(--color-danger-border);}
  .badge.tier-high{background:var(--color-danger-bg);color:var(--color-danger-fg);border-color:var(--color-danger-border);}
  .badge.tier-medium{background:var(--color-warning-bg);color:var(--color-warning-fg);border-color:var(--color-warning-border);}
  .badge.tier-low{background:var(--color-success-bg);color:var(--color-success-fg);border-color:var(--color-success-border);}
  .badge.mandatory{background:var(--color-warning-bg);color:var(--color-warning-fg);border-color:var(--color-warning-border);}
  .badge.neutral{background:var(--color-surface-alt);color:var(--color-muted);border-color:var(--color-border);transform:none;text-transform:none;letter-spacing:normal;font-family:var(--font-sans);font-weight:600;animation:none;}

  .field-section-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--color-muted);font-weight:700;margin:18px 0 8px;padding-block-end:6px;border-block-end:1px solid var(--color-border);font-family:var(--font-mono);}
  .field-section-title:first-child{margin-top:0;}
  .field-card{
    display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:start;
    border:1px solid var(--color-border);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:10px;background:var(--color-surface);
  }
  .field-card.mandatory-review{border-inline-start:4px solid var(--color-warning-border);}
  .field-card.high-risk{border-inline-start:4px solid var(--color-danger-border);}
  .field-card .field-label{font-weight:700;font-size:12.5px;grid-column:1/2;}
  .field-card .field-tags{grid-column:2/3;display:flex;gap:6px;align-self:start;}
  .field-card .field-value{grid-column:1/3;font-size:13px;margin-top:2px;}
  .field-card .field-value.locked{color:var(--color-muted);font-style:italic;display:flex;align-items:center;gap:6px;}
  .field-card .field-foot{grid-column:1/3;display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
  .cite-link{
    border:none;background:none;color:var(--color-primary);font-size:11px;font-weight:700;cursor:pointer;padding:2px 4px;
    display:flex;align-items:center;gap:4px;text-decoration:underline;text-underline-offset:2px;font-family:var(--font-mono);
  }
  .cite-link:hover{color:var(--color-primary-strong);}
  .delta-before{color:var(--color-muted);text-decoration:line-through;font-size:12px;}
  .delta-after{font-weight:700;font-size:13px;}

  /* Inline field editing (review-not-create: the human commits) */
  .field-card.editing{border-inline-start:4px solid var(--color-primary);}
  .field-card.is-confirmed{background:var(--color-success-bg);}
  .field-edit-input{width:100%;border:1px solid var(--color-primary);border-radius:var(--radius-sm);padding:8px 10px;background:var(--color-surface);color:var(--color-fg);font-family:inherit;font-size:13px;}
  .field-edit-input:focus{outline:2px solid var(--color-primary);outline-offset:1px;}
  .field-foot .inline-actions{margin-top:0;gap:6px;}
  .field-value.blank-note{color:var(--color-muted);font-style:normal;display:flex;align-items:center;gap:6px;}
  .badge.confirmed{background:var(--color-success-bg);color:var(--color-success-fg);border-color:var(--color-success-border);transform:none;text-transform:none;letter-spacing:normal;font-family:var(--font-sans);animation:none;font-weight:600;}
  .badge.edited{background:var(--color-info-bg);color:var(--color-primary-strong);border-color:var(--color-info-border);transform:none;text-transform:none;letter-spacing:normal;font-family:var(--font-sans);animation:none;font-weight:600;}
  .filter-chip.attention{border-color:var(--color-warning-border);color:var(--color-warning-fg);}
  .filter-chip.attention[aria-pressed="true"]{background:var(--color-warning-border);border-color:var(--color-warning-border);color:#fff;}

  /* Resumability (§10 — a 30-50 field onboarding won't complete in one sitting) */
  .resume-card{max-width:640px;margin:0 auto 16px;text-align:start;display:flex;justify-content:space-between;align-items:center;gap:14px;}
  .resume-card .rc-body strong{font-size:13.5px;font-family:var(--font-display);}

  /* Read-only failure state (§7.10 identity/entitlements) */
  .icon-btn:disabled{opacity:.45;cursor:not-allowed;}
  .icon-btn:disabled:hover{color:var(--color-muted);border-color:var(--color-border);}
  .composer-input:disabled{opacity:.6;cursor:not-allowed;}
  .readonly-banner{display:none;align-items:center;gap:10px;background:var(--color-danger-bg);border:1px solid var(--color-danger-border);color:var(--color-danger-fg);border-radius:var(--radius-md);padding:9px 12px;margin-bottom:10px;font-size:12.5px;}
  .readonly-banner svg{flex:none;}
  .readonly-banner .btn{margin-inline-start:auto;flex:none;}

  table.data-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.data-table th{
    text-align:start;color:var(--color-muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em;
    padding:8px 10px;border-block-end:2px solid var(--color-border);white-space:nowrap;
  }
  table.data-table td{padding:9px 10px;border-block-end:1px solid var(--color-border);vertical-align:top;}
  table.data-table tr.high-risk td:first-child{box-shadow:inset 3px 0 0 var(--color-danger-border);}
  table.data-table tbody tr:hover{background:var(--color-surface-alt);}
  .sortable-th{cursor:pointer;display:inline-flex;align-items:center;gap:4px;background:none;border:none;color:inherit;font:inherit;text-transform:uppercase;letter-spacing:.03em;padding:0;}
  .sortable-th:hover{color:var(--color-primary);}

  .checklist-group{margin-bottom:16px;}
  .checklist-group h3{font-size:12.5px;margin:0 0 8px;display:flex;align-items:center;gap:6px;}
  .check-row{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border:1px solid var(--color-border);border-radius:var(--radius-sm);margin-bottom:6px;background:var(--color-surface);}
  .check-row input[type="checkbox"]{margin-top:3px;flex:none;}
  .check-row .crow-title{font-weight:600;font-size:12.5px;}
  .check-row .crow-sub{color:var(--color-muted);font-size:11.5px;margin-top:2px;}
  .check-row.redflag{border-color:var(--color-danger-border);background:var(--color-danger-bg);}

  /* ---------- CDD Typing questionnaire (KYC PRD §7.3) ---------- */
  .cdd-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:9px 12px;border:1px solid var(--color-border);border-radius:var(--radius-sm);margin-bottom:6px;background:var(--color-surface);}
  .cdd-row .cdd-q{font-family:var(--font-mono);font-size:11px;color:var(--color-muted);flex:none;width:24px;}
  .cdd-row .cdd-body{flex:1;min-width:0;}
  .cdd-row .cdd-label{font-size:12.5px;font-weight:600;}
  .cdd-row .cdd-note{font-size:11px;color:var(--color-accent);margin-top:3px;}
  /* "Suggested, not confirmed" — the visual pattern Sentinel Output 5 recommended in place
     of inline prose: a dashed border + a distinct tag, used for both confidence-based
     prefills (e.g. Q2) and would-be screening-derived recommendation flags (Q5/Q11). */
  .cdd-row.suggested{border-style:dashed;border-color:var(--color-accent);}
  .cdd-row.needs-input{border-style:dashed;border-color:var(--color-warning-border);background:var(--color-warning-bg);}
  .cdd-answer-toggle{display:flex;gap:4px;flex:none;}
  .cdd-answer-btn{border:1px solid var(--color-border);background:var(--color-surface-alt);border-radius:6px;padding:5px 13px;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--color-muted);}
  .cdd-answer-btn:hover{border-color:var(--color-primary);color:var(--color-primary);}
  .cdd-answer-btn[aria-pressed="true"]{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-primary-fg);}
  .cdd-group-toggle{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;cursor:pointer;padding:0;margin:18px 0 8px;text-align:start;}
  .cdd-group-toggle .field-section-title{margin:0;flex:1;}
  .cdd-group-toggle .cdd-caret{transition:transform .15s ease;color:var(--color-muted);flex:none;}
  .cdd-group-toggle[aria-expanded="true"] .cdd-caret{transform:rotate(180deg);}

  .status-card{max-width:520px;}
  .status-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-block-end:1px solid var(--color-border);}
  .status-row:last-of-type{border-block-end:none;}
  .status-row .k{color:var(--color-muted);font-size:12.5px;}
  .status-row .v{font-weight:700;font-size:13px;text-align:end;}
  .readonly-note{display:flex;gap:8px;align-items:flex-start;background:var(--color-surface-alt);border-radius:var(--radius-sm);padding:10px 12px;margin-top:14px;color:var(--color-muted);font-size:11.5px;}

  .filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .filter-chip{border:1px solid var(--color-border);background:var(--color-surface);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--color-muted);}
  .filter-chip[aria-pressed="true"]{background:var(--color-primary);border-color:var(--color-primary);color:var(--color-primary-fg);}

  .progress-tracker{display:flex;flex-direction:column;gap:10px;max-width:480px;}
  .ptrack-step{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);}
  .ptrack-step .ptrack-icon{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--color-surface-alt);color:var(--color-muted);border:1px solid var(--color-border);}
  .ptrack-step.done .ptrack-icon{background:var(--color-success-bg);color:var(--color-success-fg);border-color:var(--color-success-border);}
  .ptrack-step.active .ptrack-icon{background:var(--color-info-bg);color:var(--color-primary);border-color:var(--color-primary);}
  .ptrack-step .ptrack-label{font-size:12.5px;font-weight:600;}
  .ptrack-step.pending .ptrack-label{color:var(--color-muted);font-weight:500;}
  .spin{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ .spin{animation:none;} }

  .info-banner{
    display:flex;gap:10px;align-items:flex-start;background:var(--color-info-bg);border:1px solid var(--color-info-border);
    border-radius:var(--radius-md);padding:11px 14px;font-size:12.5px;margin-bottom:16px;
  }
  .info-banner svg{flex:none;color:var(--color-primary);margin-top:1px;}

  /* ---------- Drawer ---------- */
  .drawer-backdrop{position:fixed;inset:0;background:rgba(10,14,20,.4);display:none;z-index:20;}
  .drawer-backdrop.open{display:block;}
  .drawer{
    position:fixed;inset-block:0;inset-inline-end:0;width:min(420px,92vw);background:var(--color-surface);
    box-shadow:var(--shadow-md);z-index:21;transform:translateX(110%);transition:transform .25s ease;
    display:flex;flex-direction:column;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-block-end:1px solid var(--color-border);}
  .drawer-head h2{font-size:15px;margin:0;font-family:var(--font-display);}
  .drawer-body{padding:18px;overflow-y:auto;flex:1;}
  .source-snippet{background:var(--color-surface-alt);border:1px solid var(--color-border);border-inline-start:3px solid var(--color-primary);border-radius:var(--radius-sm);padding:12px;font-size:12.5px;line-height:1.6;margin-top:10px;font-family:var(--font-mono);}
  .source-snippet mark{background:var(--color-warning-bg);color:var(--color-warning-fg);padding:0 2px;border-radius:3px;}

  /* ---------- Prototype navigator (review-only, not product UI) ---------- */
  .proto-nav{
    position:fixed;inset-block-end:16px;inset-inline-end:16px;z-index:15;
    background:var(--color-surface);border:1px dashed var(--color-muted);border-radius:var(--radius-md);
    box-shadow:var(--shadow-md);font-size:12px;max-width:240px;
  }
  .proto-nav-head{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;cursor:pointer;gap:8px;}
  .proto-nav-head span{font-weight:700;color:var(--color-muted);font-style:italic;}
  .proto-nav-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:5px;max-height:300px;overflow-y:auto;}
  .proto-nav.collapsed .proto-nav-body{display:none;}
  .proto-nav-btn{
    text-align:start;border:1px solid var(--color-border);background:var(--color-surface-alt);border-radius:var(--radius-sm);
    padding:6px 9px;cursor:pointer;color:var(--color-fg);font-size:11.5px;
  }
  .proto-nav-btn:hover{border-color:var(--color-primary);color:var(--color-primary);}
  .proto-nav-btn[aria-current="true"]{background:var(--color-primary);color:var(--color-primary-fg);border-color:var(--color-primary);}

  .toast-host{position:fixed;inset-block-end:16px;inset-inline-start:16px;z-index:30;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--color-fg);color:var(--color-bg);padding:9px 14px;border-radius:var(--radius-sm);font-size:12.5px;box-shadow:var(--shadow-md);max-width:340px;}

  @media (max-width:860px){
    .main{grid-template-columns:1fr;grid-template-rows:1fr 1fr auto;}
    .resizer-v{display:none;}
    .chat-pane{border-inline-end:none;border-block-end:1px solid var(--color-border);}
    .roster-pane{border-inline-start:none;border-block-start:1px solid var(--color-border);max-height:260px;}
  }

  @media print{
    :root{--color-bg:#fff;--color-fg:#000;--color-muted:#555;--color-border:#999;}
    .topbar,.chat-pane,.roster-pane,.resizer,.proto-nav,.toast-host,.canvas-header .btn{display:none !important;}
    .main{grid-template-columns:1fr;}
    @page{margin:0.75in;}
    tr,td,th{page-break-inside:avoid;}
  }
</style>
</head>
<body>
<div class="app">

  <!-- ================= TOP BAR ================= -->
  <header class="topbar">
    <button type="button" class="brand" id="brand-btn" data-action="go-home" aria-label="Back to the KAI Sentinel home">
      <span class="brand-mark" aria-hidden="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 12l6 6L20 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span><span id="brand-title">Onboarding Assistant</span><span class="brand-sub" id="brand-sub"> · KAI Sentinel · TPA</span></span>
    </button>
    <button type="button" class="topbar-nav-btn" id="third-parties-nav-btn" data-action="open-third-parties" aria-pressed="false">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Third Parties</span>
    </button>
    <button type="button" class="topbar-nav-btn" id="kyc-cases-nav-btn" data-action="open-kyc-cases" aria-pressed="false" style="display:none;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>KYC Cases</span>
    </button>
    <div class="persona-switch" style="margin-inline-start:2px;">
      <span class="persona-switch-label" id="process-label">Process</span>
      <div class="segmented" role="group" aria-labelledby="process-label">
        <button type="button" data-action="set-process" data-process="tpa" aria-pressed="true">TPA</button>
        <button type="button" data-action="set-process" data-process="kyc" aria-pressed="false">FM&amp;I KYC</button>
      </div>
    </div>
    <div class="topbar-spacer"></div>
    <div class="persona-switch">
      <span class="persona-switch-label" id="persona-label">Viewing as</span>
      <div class="segmented" role="group" aria-labelledby="persona-label">
        <button type="button" data-action="set-persona" data-persona="requester" aria-pressed="true">Requester</button>
        <button type="button" data-action="set-persona" data-persona="reviewer" aria-pressed="false">R&amp;C reviewer</button>
      </div>
    </div>
    <div class="identity-chip">
      <span class="identity-avatar" aria-hidden="true">DT</span>
      <span id="identity-text">Da'yl Tan · Requester · Keppel O&amp;M – Marine</span>
      <button type="button" class="info-btn" data-action="open-drawer" data-drawer="role-info" title="How role is determined" aria-label="How role is determined">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M12 11v5M12 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <!-- ================= MAIN: CHAT + CANVAS ================= -->
  <div class="main">
    <section class="chat-pane" aria-label="Conversation">
      <div class="chat-log" id="chat-log" aria-live="polite"></div>
      <div class="chat-composer">
        <div class="readonly-banner" id="readonly-banner" role="status"></div>
        <div class="chip-row" id="chip-row"></div>
        <div class="composer-row">
          <button type="button" class="icon-btn" data-action="composer-attach" title="Attach documents" aria-label="Attach documents">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21 12.5l-8.4 8.4a5 5 0 01-7.1-7.1l9-9a3.5 3.5 0 015 5l-8.9 8.9a2 2 0 01-2.8-2.8l8-8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <input type="text" class="composer-input" id="composer-input" placeholder="Type a company name, e.g. “Onboard Acme Marine Pte Ltd”" aria-label="Message">
          <button type="button" class="icon-btn" data-action="composer-send" title="Send" aria-label="Send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 12h16M14 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </section>

    <div class="resizer resizer-v" data-resize="chat-canvas" role="separator" aria-orientation="vertical" aria-label="Resize conversation panel" aria-valuemin="280" aria-valuemax="1000" tabindex="0"></div>

    <section class="canvas-pane" aria-label="Structured workspace">
      <div class="canvas-top" aria-label="Structured data staged to RCTP for submission">
        <div class="canvas-header" id="canvas-header"></div>
        <div class="canvas-body" id="canvas-body"></div>
      </div>
      <div class="resizer resizer-h" id="canvas-split-resizer" data-resize="canvas-top-bottom" role="separator" aria-orientation="horizontal" aria-label="Resize workspace vs. compliance screening" tabindex="0" style="display:none;"></div>
      <div class="canvas-bottom" aria-label="Compliance screening (permanent section)">
        <div class="canvas-header" id="canvas-bottom-header"></div>
        <div class="canvas-body" id="compliance-screening-permanent"></div>
      </div>
    </section>

    <div class="resizer resizer-v" data-resize="canvas-roster" role="separator" aria-orientation="vertical" aria-label="Resize third parties panel" aria-valuemin="180" aria-valuemax="600" tabindex="0"></div>

    <section class="roster-pane" aria-label="Your third parties">
      <div class="roster-header" id="roster-header"></div>
      <div class="roster-body" id="roster-body"></div>
    </section>
  </div>

  <!-- ================= THIRD PARTIES (full page, topbar-accessible) ================= -->
  <section class="tp-page" id="tp-page" aria-label="All third parties">
    <div id="tp-page-content"></div>
  </section>

  <!-- ================= KYC CASES (full page, topbar-accessible — KYC PRD §7.12) ================= -->
  <section class="tp-page kyc-page" id="kyc-page" aria-label="All KYC cases">
    <div id="kyc-page-content"></div>
  </section>
</div>

<!-- ================= CITATION / INFO DRAWER ================= -->
<div class="drawer-backdrop" id="drawer-backdrop" data-action="close-drawer"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" tabindex="-1">
  <div class="drawer-head">
    <h2 id="drawer-title">Source</h2>
    <button type="button" class="icon-btn" data-action="close-drawer" aria-label="Close">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<!-- ================= PROTOTYPE NAVIGATOR (review aid only) ================= -->
<div class="proto-nav collapsed" id="proto-nav">
  <div class="proto-nav-head" data-action="toggle-proto-nav">
    <span>Prototype navigator — jump to any screen (review aid, not part of the product)</span>
    <svg id="proto-nav-caret" width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div class="proto-nav-body" id="proto-nav-body"></div>
</div>

<div class="toast-host" id="toast-host"></div>

<script>
(function(){
  "use strict";

    {label:"Parent company", value:"Marine Holdings Pte Ltd", confidence:"high", source:"p.2, Contract", snippet:"“…a subsidiary of Marine Holdings Pte Ltd (the ‘Parent’)…”"}

  // ~30 admin fields grouped by domain — a real onboarding is 30-50 fields (PRD §5),

  // the handful a mockup might show. Each field carries a `group` for domain sub-grouping.
  var DRAFT_ADMIN = [
    // Corporate identity
    {label:"Registered address", value:"8 Marina Boulevard, #05-01, Singapore 018981", confidence:"high", source:"p.1, ACRA Bizfile", snippet:"“Registered Office Address: 8 MARINA BOULEVARD #05-01 SINGAPORE 018981”", group:"Corporate identity"},
    {label:"Company UEN", value:"202145678K", confidence:"high", source:"p.1, ACRA Bizfile", snippet:"“Unique Entity Number: 202145678K”", group:"Corporate identity"},
    {label:"Legal entity type", value:"Private Company Limited by Shares", confidence:"high", source:"p.1, ACRA Bizfile", snippet:"“Company Type: EXEMPT PRIVATE COMPANY LIMITED BY SHARES”", group:"Corporate identity"},
    {label:"Date of incorporation", value:"14 Mar 2021", confidence:"high", source:"p.1, ACRA Bizfile", snippet:"“Incorporation Date: 14/03/2021”", group:"Corporate identity"},
    {label:"Former names", value:"None recorded", confidence:"medium", source:"p.2, ACRA Bizfile", snippet:"“Former Name(s): NIL”", group:"Corporate identity"},
    {label:"Principal activity (SSIC)", value:"30110 — Building of ships, tankers & floating structures", confidence:"medium", source:"p.2, ACRA Bizfile", snippet:"“Primary SSIC: 30110 BUILDING OF SHIPS, TANKERS AND OTHER OCEAN-GOING VESSELS”", group:"Corporate identity"},

  /* ============================================================

      inbox:'<svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M3 12h5l2 3h4l2-3h5" stroke="currentColor" stroke-width="1.5"/><path d="M5 5h14l2 7v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6l2-7z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',

      external:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V6a1 1 0 011-1h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      edit:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 00-3-3L5 17v3z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M13.5 6.5l3 3" stroke="currentColor" stroke-width="1.7"/></svg>'

  function confidenceBadge(level){
    if(!level) return "";
    var text = level.charAt(0).toUpperCase()+level.slice(1);
    return '<span class="badge confidence-'+level+'">'+text+' confidence</span>';
  }
  function tierBadge(tier){
    var text = tier.charAt(0).toUpperCase()+tier.slice(1);
    return '<span class="badge tier-'+tier+'">'+text+'</span>';
  }
  // KYC checklist-item status — evidence, not a verdict (no "CTC valid ✓" style mark;
  // Non-CTC and Missing both read as open work, per both PRDs' "evidence, not verdicts").
  function checklistStatusBadge(status){
    var map = {present:["Present","confidence-high"], missing:["Missing","confidence-low"], nonctc:["Non-CTC","confidence-low"]};
    var m = map[status] || [status, "neutral"];
    return '<span class="badge '+m[1]+'">'+m[0]+'</span>';
  }
  function toast(msg){
    var host = $("#toast-host");
    var t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    host.appendChild(t);
    setTimeout(function(){ t.remove(); }, 3600);
  }
  function scrollChatToEnd(){
    var log = $("#chat-log");
    log.scrollTop = log.scrollHeight;
  }

  // §7.10 — identity-unverifiable / entitlements-stale put the client into a real
  // read-only mode: composer + task chips disabled, persistent banner with an escalate/retry
  // path. The client reflects the server's fail-closed denial, it does not soften it.
  function applyChipDisabled(){
    var chips = document.querySelectorAll('#chip-row .chip');
    Array.prototype.forEach.call(chips, function(c){
      if(c.getAttribute("data-permanent-disabled") === "1") return;
      c.disabled = state.readOnly;
    });
  }
  function setReadOnly(on, reason){
    state.readOnly = on;
    state.readOnlyReason = on ? (reason || null) : null;
    var banner = $("#readonly-banner");
    if(banner){
      if(on){
        banner.innerHTML = icon("warn")+'<div>'+reason+'</div><button type="button" class="btn" data-action="exit-readonly">Retry sign-in</button>';
        banner.style.display = "flex";
      } else {
        banner.style.display = "none";
        banner.innerHTML = "";
      }
    }
    var input = $("#composer-input");
    if(input){
      input.disabled = on;
      input.placeholder = on
        ? "Read-only — writes are disabled until this is resolved"
        : "Type a company name, e.g. “Onboard Acme Marine Pte Ltd”";
    }
    document.querySelectorAll('[data-action="composer-send"],[data-action="composer-attach"]').forEach(function(b){ b.disabled = on; });
    applyChipDisabled();
  }

  /* ============================================================
     CHAT RENDERING
     ============================================================ */
  function addMessage(role, html, opts){
    opts = opts || {};
    var log = $("#chat-log");
    var wrap = document.createElement("div");
    wrap.className = "msg " + role;
    var bubbleClasses = "bubble" + (opts.handoff ? " handoff-bubble" : "") + (opts.alert ? " alert-bubble" : "");
    wrap.innerHTML = '<div class="'+bubbleClasses+'">'+html+'</div>';
    log.appendChild(wrap);
    scrollChatToEnd();
    return wrap;
  }

  function renderChips(){
    var row = $("#chip-row");
    var tasks = (state.process === "kyc" ? TASKS_REQUESTER_KYC : TASKS_REQUESTER_TPA).slice();
    if(state.persona === "reviewer"){ tasks = tasks.concat(state.process === "kyc" ? TASKS_REVIEWER_EXTRA_KYC : TASKS_REVIEWER_EXTRA); }
    var html = tasks.map(function(t){
      return '<button type="button" class="chip" data-action="chip-task" data-task="'+t.id+'"'+(t.tone?' data-tone="'+t.tone+'"':'')+'>'+esc(t.label)+'</button>';
    }).join("");
    row.innerHTML = html;
    applyChipDisabled();

  /* ============================================================
     ROSTER PANE (access-scoped third-party list)
     ============================================================ */
  // Looser-than-exact match so typed/clicked company names resolve the same way
  // the "Find" dedup check already relies on (PRD §7.1).
  // Process-generalized registry access (PRD TPA §8 — same shell, per-process record shape).
  // The full-page "Third Parties" index stays TPA-only by its own explicit call
  // (scopedThirdParties, below) — these helpers are for the roster pane and name
  // prompts, which are shared shell surfaces and must reflect whichever process is active.
  function currentRegistry(){ return state.process === "kyc" ? KYC_CASES : THIRD_PARTIES; }
  function currentBU(){ return state.process === "kyc" ? CURRENT_USER_BU_KYC : CURRENT_USER_BU; }
  function scopedRecords(){
    return state.persona === "reviewer"
      ? currentRegistry().slice()
      : currentRegistry().filter(function(r){ return r.bu === currentBU(); });
  }
  function findRecordFor(name){
    if(!name) return null;
    var n = name.toLowerCase();
    var registry = currentRegistry();
    var exact = registry.filter(function(tp){ return tp.name.toLowerCase() === n; })[0];
    if(exact) return exact;
    return registry.filter(function(tp){
      var tn = tp.name.toLowerCase();
      return tn.indexOf(n) !== -1 || n.indexOf(tn.split(" ")[0]) !== -1;
    })[0] || null;
  }
  function pushRecent(entry){
    if(!entry || !entry.name) return;
    state.recentlyWorked = state.recentlyWorked.filter(function(r){ return r.ref !== entry.ref; });
    state.recentlyWorked.unshift({
      name: entry.name, ref: entry.ref || "—", tier: entry.tier || null,
      status: entry.status || "", when: "Just now"
    });
    state.recentlyWorked = state.recentlyWorked.slice(0, 5);
    renderRoster();
  }
  function rosterItemHtml(tp){
    return '<button type="button" class="roster-item" data-action="roster-open" data-name="'+esc(tp.name)+'">'+
      '<div class="ri-name">'+esc(tp.name)+'</div>'+
      '<div class="ri-meta"><span class="ri-ref">'+esc(tp.ref)+'</span>'+(tp.tier ? tierBadge(tp.tier) : '<span class="badge neutral">'+(tp.ref && tp.ref.indexOf("KYC-")===0 ? "Tier TBD" : "New")+'</span>')+'</div>'+
      (tp.status ? '<div class="ri-status">'+esc(tp.status)+'</div>' : '')+
      (tp.when ? '<div class="ri-status">'+esc(tp.when)+'</div>' : '')+
    '</button>';
  }
  // Requesters see their own Business Unit only; R&C reviewers span all BUs (grouped),
  // mirroring the access-rights model described in the role-info drawer.
  function renderRoster(){
    var header = $("#roster-header");
    var label = state.process === "kyc" ? "Your KYC cases" : "Your third parties";
    var scopeLabel = state.persona === "reviewer" ? "All Business Units · R&C" : currentBU();
    header.innerHTML = '<h1>'+esc(label)+'</h1><div class="sub">'+esc(scopeLabel)+'</div>';

    // "Recently worked on" is a session-scoped list shared across processes (roster pane
    // per-process split is an open question in KYC PRD §8 — not a confirmed decision).
    var html = '<div class="roster-section"><div class="roster-section-title">Recently worked on</div>';
    html += state.recentlyWorked.length
      ? state.recentlyWorked.map(rosterItemHtml).join("")
      : '<div class="roster-empty">Nothing yet this session — items you open will appear here.</div>';
    html += '</div>';

    var registry = currentRegistry();
    if(state.persona === "reviewer"){
      var groups = {}, order = [];
      registry.forEach(function(tp){
        if(!groups[tp.bu]){ groups[tp.bu] = []; order.push(tp.bu); }
        groups[tp.bu].push(tp);
      });
      order.forEach(function(bu){
        html += '<div class="roster-section"><div class="roster-section-title">'+esc(bu)+' ('+groups[bu].length+')</div>'+
          groups[bu].map(rosterItemHtml).join("")+'</div>';
      });
    } else {
      var mine = registry.filter(function(tp){ return tp.bu === currentBU(); });
      html += '<div class="roster-section"><div class="roster-section-title">'+esc(currentBU())+' ('+mine.length+')</div>'+
        mine.map(rosterItemHtml).join("")+'</div>';
    }

    $("#roster-body").innerHTML = html;
  }

  /* ============================================================
     THIRD PARTIES PAGE (full page, topbar-accessible)
     Shows every third party the current viewer has access to, using only data the
     client already has locally (THIRD_PARTIES + this session's recentlyWorked) — it
     never simulates a fetch, so a "Cached" column makes that explicit.
     ============================================================ */
  function cachedLabelFor(tp){
    var recent = state.recentlyWorked.filter(function(r){ return r.ref === tp.ref; })[0];
    return recent ? recent.when : (tp.cachedAt || "—");
  }
  function filteredTpPage(){
    var list = scopedThirdParties();
    var f = state.tpPageFilter;
    if(f.tier !== "all"){ list = list.filter(function(tp){ return tp.tier === f.tier; }); }
    if(f.query){
      var q = f.query.toLowerCase();
      list = list.filter(function(tp){
        return tp.name.toLowerCase().indexOf(q) !== -1 || tp.ref.toLowerCase().indexOf(q) !== -1;
      });
    }
    return list;
  }
  // The only record with a populated workspace draft + screening result cached locally
  // in this prototype is the demo company (COMPANY) — everything else genuinely has
  // nothing staged yet, so the expansion says so rather than fabricating data.
  function tpExpandedContentHtml(tp){
    if(tp.name !== COMPANY.name){
      return '<div class="tp-expand-empty">'+icon("inbox")+
        '<div><strong>Nothing cached yet</strong><div class="tp-expand-empty-sub">No workspace draft or compliance screening has been staged locally for this record. Start an onboarding or renewal to populate it.</div></div>'+
      '</div>';
    }
    ensureDraftState();
    var mandatoryRows = DRAFT_MANDATORY.map(function(f){
      var st = state.draftFields ? state.draftFields[f.label] : null;
      var val = st ? st.value : (f.value || "");
      return '<div class="tp-expand-field"><span class="tp-expand-field-label">'+esc(f.label)+'</span>'+
        '<span class="tp-expand-field-value">'+(val ? esc(val) : '<em style="font-style:italic;color:var(--color-muted);">Not cached</em>')+'</span></div>';
    }).join("");

    var entities = screeningEntities(state.screeningMode || "onboard");
    var counts = {hit:0, review:0, clear:0};
    entities.forEach(function(e){ counts[e.status] += 1; });
    var entityRows = entities.map(function(e){
      return '<div class="tp-expand-field"><span class="tp-expand-field-label">'+esc(e.name)+'<span style="color:var(--color-muted);"> · '+esc(e.relationship)+'</span></span>'+screeningStatusBadge(e.status)+'</div>';
    }).join("");

    return '<div class="tp-expand-grid">'+
        '<div><div class="tp-expand-heading">Workspace <span class="badge neutral">'+DRAFT_MANDATORY.length+' mandatory · '+DRAFT_ADMIN.length+' admin fields cached</span></div>'+mandatoryRows+'</div>'+
        '<div><div class="tp-expand-heading">Compliance screening <span class="badge tier-low">'+counts.clear+' clear</span> <span class="badge tier-medium">'+counts.review+' review</span> <span class="badge tier-high">'+counts.hit+' hit</span></div>'+entityRows+'</div>'+
      '</div>'+
      '<div class="tp-expand-actions"><button type="button" class="btn primary" data-action="tp-page-open-record" data-name="'+esc(tp.name)+'">Open full record in assistant &rarr;</button></div>';
  }

    }).join("") || '<tr><td colspan="'+colspan+'" style="text-align:center;color:var(--color-muted);padding:20px;">No third parties match this filter.</td></tr>';

  // --- Draft field runtime state (edits/confirmations persist across filter + resume) ---
  function ensureDraftState(){
    if(state.draftFields) return;
    state.draftFields = {};
    DRAFT_MANDATORY.concat(DRAFT_ADMIN).forEach(function(f){
      state.draftFields[f.label] = {
        value: (f.value != null ? f.value : ""),
        confirmed: false,
        edited: false
      };
    });
  }
  function resetDraftState(){
    state.draftFields = null;
    state.editingField = null;
    state.draftFilter = "all";
    state.inProgressTpa = null;
  }
  function findFieldDef(label){
    return DRAFT_MANDATORY.concat(DRAFT_ADMIN).filter(function(f){ return f.label === label; })[0];
  }
  // A field needs the reviewer's attention if it isn't confirmed yet and is either blank
  // or low-confidence (PRD §5 "quick navigation to blank/low-confidence fields").
  // Locked fields are R&C-maintained, not the requester's to action.
  function fieldNeedsAttention(f){
    if(f.locked) return false;
    ensureDraftState();
    var st = state.draftFields[f.label];
    if(st && st.confirmed) return false;
    var val = st ? st.value : (f.value || "");
    if(!val) return true;
    if(f.confidence === "low") return true;
    return false;
  }
  // Lightweight nod to §11 instrumentation — the correction signal the plans want measured.
  function logEvent(name, detail){ try{ console.log("[instrumentation]", name, detail || {}); }catch(e){} }

  function citeBtn(f){
    if(!f.source) return '<span class="mono" style="font-size:11px;color:var(--color-muted);">No source in documents</span>';
    return '<button type="button" class="cite-link" data-action="open-citation" data-source="'+esc(f.source)+'" data-snippet="'+esc(f.snippet||"")+'">'+icon("doc")+' '+esc(f.source)+'</button>';
  }

  function fieldCardHtml(f, extraClass){
    ensureDraftState();
    var key = f.label;
    var st = state.draftFields[key] || {value:(f.value||""), confirmed:false, edited:false};

    // Locked — maintained by R&C policy, never editable here (§7.10 write-denied — role)
    if(f.locked){
      return '<div class="field-card '+(extraClass||"")+'">'+
        '<div class="field-label">'+esc(f.label)+'</div>'+
        '<div class="field-tags"><span class="badge neutral">'+icon("lock")+' Locked</span></div>'+
        '<div class="field-value locked">'+icon("lock")+' '+esc(f.locked)+'</div>'+
      '</div>';
    }

    // Inline edit mode — the human enters/corrects the value and commits it
    if(state.editingField === key){
      return '<div class="field-card editing '+(extraClass||"")+'">'+
        '<div class="field-label">'+esc(f.label)+'</div>'+
        '<div class="field-tags"></div>'+
        '<div class="field-value"><input type="text" id="draft-edit-input" class="field-edit-input" value="'+esc(st.value)+'" placeholder="Enter a value" aria-label="'+esc(f.label)+'"></div>'+
        '<div class="field-foot">'+citeBtn(f)+
          '<div class="inline-actions">'+
            '<button type="button" class="btn primary" data-action="field-save" data-field="'+esc(key)+'">'+icon("check")+' Save</button>'+
            '<button type="button" class="btn subtle" data-action="field-cancel">Cancel</button>'+
          '</div>'+
        '</div>'+
      '</div>';
    }

    // Tags: confirmed / edited status + confidence (or blank/needs-confirmation)
    var tags = "";
    if(st.confirmed){ tags += '<span class="badge confirmed">'+icon("check")+' Confirmed</span>'; }
    if(st.edited){ tags += '<span class="badge edited">Edited</span>'; }
    if(!st.value){
      tags += '<span class="badge confidence-low">'+(f.unverified ? "Needs confirmation" : "Blank")+'</span>';
    } else if(!st.edited){
      tags += confidenceBadge(f.confidence);
    }

    // Value: blank fields never carry a guessed fill (§2.1 / §7.10 extraction-weak)
    var valueHtml;
    if(!st.value){
      valueHtml = f.unverified
        ? '<div class="field-value blank-note" style="color:var(--color-warning-fg);">'+icon("warn")+' Left blank — the source doesn\'t state this. Confirm directly; not guessed.</div>'
        : '<div class="field-value blank-note">'+icon("warn")+' Not found in the documents — enter manually. Nothing was guessed.</div>';
    } else {
      valueHtml = '<div class="field-value">'+esc(st.value)+'</div>';
    }

    var actions = '<div class="inline-actions">'+
      '<button type="button" class="btn subtle" data-action="field-edit" data-field="'+esc(key)+'">'+icon("edit")+' Edit</button>'+
      ((st.value && !st.confirmed) ? '<button type="button" class="btn" data-action="field-confirm" data-field="'+esc(key)+'">'+icon("check")+' Confirm</button>' : '')+
    '</div>';

    return '<div class="field-card '+(extraClass||"")+(st.confirmed?" is-confirmed":"")+'">'+
      '<div class="field-label">'+esc(f.label)+'</div>'+
      '<div class="field-tags">'+tags+'</div>'+
      valueHtml+
      '<div class="field-foot">'+citeBtn(f)+actions+'</div>'+
    '</div>';
  }

  // KYC checklist-item card — same visual language as fieldCardHtml (field-card grid,
  // mandatory-review left border, citation link) but status-based (Present/Missing/
  // Non-CTC) instead of a typed value. `it` is the runtime record from state.kycWave1
  // (see ensureKycWave1State) — mutable per item: confirm/unconfirm, replace/remove the
  // attached document, with a non-expiring inline Undo after a remove (no timed toast —
  // a destructive action needs a recoverable state, not a countdown).
  function checklistItemCardHtml(it, wave){
    wave = wave || 1;
    var tags = checklistStatusBadge(it.status) + (it.confidence ? confidenceBadge(it.confidence) : "");
    if(it.mandatory !== false){ tags += ' <span class="badge mandatory">Mandatory</span>'; }
    if(it.confirmed){ tags += ' <span class="badge confirmed">'+icon("check")+' Confirmed</span>'; }

    var valueHtml;
    if(it.justRemoved){
      valueHtml = '<div class="field-value blank-note" style="color:var(--color-warning-fg);">'+icon("warn")+' Document removed just now — this item now reads as Missing.</div>';
    } else if(it.status === "present"){
      valueHtml = '<div class="field-value">On file'+(it.confidence==="medium" ? " — verify legibility" : "")+'</div>';
    } else if(it.status === "nonctc"){
      valueHtml = '<div class="field-value blank-note" style="color:var(--color-danger-fg);">'+icon("warn")+' '+esc(it.note||"Certification issue detected")+'</div>';
    } else {
      valueHtml = '<div class="field-value blank-note">'+icon("warn")+' Not received'+(it.note?' — '+esc(it.note):'')+'</div>';
    }

    var cite = (!it.justRemoved && it.source) ? citeBtn({source:it.source, snippet:it.snippet||""}) : '<span class="mono" style="font-size:11px;color:var(--color-muted);">No source yet</span>';

    var wattr = ' data-wave="'+wave+'"';
    var docActions;
    if(it.justRemoved){
      docActions = '<button type="button" class="btn primary" data-action="kyc-item-undo-remove" data-item="'+esc(it.item)+'"'+wattr+'>'+icon("refresh")+' Undo</button>';
    } else if(it.status === "present" || it.status === "nonctc"){
      docActions =
        '<button type="button" class="btn subtle" data-action="kyc-item-replace" data-item="'+esc(it.item)+'"'+wattr+'>'+icon("doc")+' Replace document</button>'+
        '<button type="button" class="btn subtle" data-action="kyc-item-remove" data-item="'+esc(it.item)+'"'+wattr+'>Remove</button>';
    } else {
      docActions = '<button type="button" class="btn" data-action="kyc-item-upload" data-item="'+esc(it.item)+'"'+wattr+'>'+icon("doc")+' Upload document</button>';
    }
    var confirmAction = it.justRemoved ? "" :
      '<button type="button" class="btn'+(it.confirmed?" subtle":"")+'" data-action="'+(it.confirmed?"kyc-item-unconfirm":"kyc-item-confirm")+'" data-item="'+esc(it.item)+'"'+wattr+'>'+
        (it.confirmed ? "Unconfirm" : icon("check")+" Confirm") +
      '</button>';

    return '<div class="field-card '+(it.mandatory!==false?"mandatory-review":"")+(it.status==="nonctc"&&!it.justRemoved?" high-risk":"")+(it.confirmed?" is-confirmed":"")+'">'+
      '<div class="field-label">'+esc(it.item)+' '+esc(it.label)+'</div>'+
      '<div class="field-tags">'+tags+'</div>'+
      valueHtml+
      '<div class="field-foot">'+cite+'<div class="inline-actions">'+docActions+confirmAction+'</div></div>'+
    '</div>';
  }

  function saveEditField(){
    var fk = state.editingField;
    if(!fk) return;
    var inp = document.getElementById("draft-edit-input");
    var newVal = inp ? inp.value.trim() : "";
    var st = state.draftFields[fk];
    var def = findFieldDef(fk);
    var prefill = def && def.value ? def.value : "";
    var changed = st ? (newVal !== st.value) : false;
    if(st){
      st.value = newVal;
      if(newVal && newVal !== prefill){ st.edited = true; }
      if(newVal){ st.confirmed = true; }   // entering a value commits it
    }
    state.editingField = null;
    renderDraftBody();
    if(newVal && newVal !== prefill){
      logEvent("field_edited_after_prefill", {field:fk});
      toast('“'+fk+'” updated and confirmed — logged as a correction (edited-after-prefill).');
    } else if(changed || newVal){
      toast('“'+fk+'” saved.');
    }
  }

  function renderProcessing(mode){
    var title = mode === "renew" ? "Renewing " + COMPANY.name : "Onboarding " + COMPANY.name;
    setCanvasHeader(title, "Building your draft — this can take a moment for multi-document uploads.");
    var steps = [
      {id:"received", label:"Documents received ("+state.uploadedFiles.length+" files)"},
      {id:"extract", label:"Extracting fields from documents"},
      {id:"match", label: mode === "renew" ? "Comparing against the current record" : "Checking for an existing record"},
      {id:"screen", label:"Submitting required-party screening"},
      {id:"stage", label:"Staging draft in RCTP"}
    ];
    var html = '<div class="progress-tracker" id="ptrack">'+steps.map(function(s,i){
      return '<div class="ptrack-step pending" data-step="'+s.id+'" style="--i:'+i+'"><span class="ptrack-icon">'+(i+1)+'</span><span class="ptrack-label">'+esc(s.label)+'</span></div>';
    }).join("")+'</div>';
    $("#canvas-body").innerHTML = html;
    runProcessingSequence(mode, steps);
  }

  function runProcessingSequence(mode, steps){
    var i = 0;
    function stepEl(id){ return document.querySelector('.ptrack-step[data-step="'+id+'"]'); }
    function mark(id, cls, iconName){
      var e = stepEl(id);
      if(!e) return;
      e.className = "ptrack-step " + cls;
      if(iconName){ e.querySelector(".ptrack-icon").innerHTML = icon(iconName); }
    }
    function tick(){
      if(i > 0){ mark(steps[i-1].id, "done", "check"); }
      if(i < steps.length){
        mark(steps[i].id, "active", "spinner");
        var cur = i;
        setTimeout(function(){
          i = cur + 1;
          tick();
        }, 750);
      } else {
        setTimeout(function(){
          if(mode === "renew"){ renderRenewDelta(); } else { renderOnboardDraft(); }
        }, 350);
      }
    }
    tick();
  }

  /* ============================================================
     FM&I KYC RENDERING — second process on the same shell (TPA PRD §8).
     Find/start a case, Wave 1 upload + processing + checklist canvas (grouped,
     locked Wave 2 stub), confirm, honest-handoff message. Screening gate / CDD
     typing / Wave 2 / Review Pack / Exception Report / Case Status / KYC Cases
     page follow further down this file.

  function renderKycFind(){

  function renderKycWave1Upload(){
    setCanvasHeader("Wave 1 — " + KYC_CASE.name, "Tier-independent document set, requested upfront (checklist is config-driven, per-process).", "welcome");
    var groups = {}, order = [];

      groups[it.group].push(it);
    });

    order.forEach(function(g){
      html += '<div class="checklist-group"><h3>'+esc(g)+'</h3>'+groups[g].map(function(it){
        var got = state.uploadedFiles.length > 0;

      }).join("")+'</div>';
